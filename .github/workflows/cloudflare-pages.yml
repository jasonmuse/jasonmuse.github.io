# Keeps jasonmuse.pages.dev the same as jasonmuse.github.io: every push to main
# uploads the site to the Cloudflare Pages project "jasonmuse". GitHub Pages is
# untouched and keeps publishing jasonmuse.github.io from main by itself.
#
# Repo secrets (Settings › Secrets and variables › Actions), set Nov 22, 2026:
#   CLOUDFLARE_API_TOKEN   the "Muse sites deploy" key (Account · Cloudflare Pages · Edit)
#   CLOUDFLARE_ACCOUNT_ID  the Cloudflare account that holds the jasonmuse Pages project
# To redeploy by hand: Actions › Deploy to jasonmuse.pages.dev › Run workflow (on main).
name: Deploy to jasonmuse.pages.dev

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time, in push order, so an older push never lands after a newer one.
concurrency:
  group: cloudflare-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    # A manual run from another branch would put that branch on the live site.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # GitHub Pages runs this repo through Jekyll, which leaves out dotfiles
      # (.github, .gitattributes, .DS_Store) and names starting with "_". Upload the
      # same set, so both addresses serve the same files. Cloudflare's own _headers
      # and _redirects still go up, if the repo ever has them.
      - name: Gather the site's files
        run: >-
          rsync -a --include='_headers' --include='_redirects'
          --exclude='.*' --exclude='_*' ./ "$RUNNER_TEMP/site/"

      - name: Upload to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          # --commit-dirty: the only local change is the action's own wrangler install.
          command: pages deploy ${{ runner.temp }}/site --project-name=jasonmuse --branch=main --commit-dirty=true

      # --branch=main updates jasonmuse.pages.dev only while main is the project's
      # production branch; otherwise Cloudflare makes a preview and the site stays old.
      - name: Make sure it went live, not to a preview
        env:
          ENVIRONMENT: ${{ steps.deploy.outputs.pages-environment }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          echo "Cloudflare made a $ENVIRONMENT deployment: $DEPLOYMENT_URL"
          if [ "$ENVIRONMENT" != "production" ]; then
            echo "::error::That's a preview, so jasonmuse.pages.dev didn't change. In Cloudflare, set the jasonmuse Pages project's production branch to main."
            exit 1
          fi

      # Every page (each index.html) should answer with its own title. A missing page
      # would show the homepage instead, since the site has no 404 page.
      - name: Check every page on jasonmuse.pages.dev
        run: |
          cd "$RUNNER_TEMP/site"
          title() { grep -o '<title>[^<]*</title>' | head -n 1 || true; }
          failed=0
          while IFS= read -r -d '' file; do
            path=${file#.}
            path=${path%index.html}
            want=$(title < "$file")
            for attempt in 1 2 3 4 5 6; do
              got=$(curl -sL "https://jasonmuse.pages.dev$path" | title) || true
              [ "$got" = "$want" ] && break
              sleep 10
            done
            if [ "$got" = "$want" ]; then
              echo "✓ $path  $got"
            else
              echo "::error::https://jasonmuse.pages.dev$path shows ${got:-no title}, expected $want"
              failed=1
            fi
          done < <(find . -name index.html -print0 | sort -z)
          exit "$failed"
