  --m-lbl:#5A657F;--m-halo:#F1E9DA;--m-hood:#8C95AA;--m-water-lbl:#5689BE;--ring:rgba(19,34,74,.42);--ring-fill:rgba(230,57,70,.05);
  --disp:'Bricolage Grotesque',Inter,system-ui,sans-serif;--logo:Montserrat,Inter,system-ui,sans-serif;--font:Inter,system-ui,-apple-system,'Segoe UI',sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);--pop:cubic-bezier(.34,1.56,.64,1);--spring:cubic-bezier(.3,1.3,.5,1);--ios:cubic-bezier(.32,.72,0,1)
}

  --accent:#FF5E6B;--ok:#5DDB8E;--deal-bg:rgba(255,94,107,.15);--deal-ink:#FFA3AB;
  --glass:rgba(46,46,50,.55);--glass-bd:rgba(255,255,255,.13);--glass-shadow:0 14px 34px rgba(0,0,0,.55);--glass-hi:rgba(255,255,255,.1);
  --lens:rgba(255,255,255,.14);--lens-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 2px 10px rgba(0,0,0,.3);--tab-ink:rgba(242,242,244,.6);--tab-on:#FF7480;
  --peach:#FFCBB6;--lilac:#DACAFF;--butter:#FFE08C;--mint:#BDE8D0;--sky:#C4DAFF;--pink:#FFC4CE;
  --tile-bd:rgba(255,255,255,0);--tile-sh:rgba(0,0,0,.6);--pin-bd:#121214;
  --m-land:#1C1C1F;--m-park:#1D2B22;--m-wood:#1B2820;--m-water:#18242F;--m-case:#141416;--m-minor:#303035;--m-major:#3D3D43;--m-hw:#4B4B52;--m-ped:#29292D;--m-bld:#252529;
  --m-lbl:#A4A4AD;--m-halo:#1C1C1F;--m-hood:#77777F;--m-water-lbl:#6B88A8;--ring:rgba(242,242,244,.42);--ring-fill:rgba(255,255,255,.025);
}

  --glass:rgba(32,44,82,.5);--glass-bd:rgba(255,255,255,.15);--pin-bd:#0A1124;

}

  --glass:rgba(50,45,38,.55);--glass-bd:rgba(255,240,220,.13);--pin-bd:#15130F;

*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg)}
body{font-family:var(--font);color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;max-width:480px;margin:0 auto;min-height:100vh;overflow-x:hidden;position:relative}
body::before{content:'';position:fixed;left:0;right:0;top:0;height:460px;background:var(--glow);pointer-events:none;z-index:0}
#app{position:relative;z-index:1}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
img{display:block}
.ic{flex:none}

/* ---------- Liquid Glass ---------- */
.glass{position:relative;background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(1.9);backdrop-filter:blur(20px) saturate(1.9);border:1px solid var(--glass-bd);box-shadow:var(--glass-shadow),inset 0 1px 0 var(--glass-hi)}
.glass::after{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(180deg,rgba(255,255,255,.32),rgba(255,255,255,0) 46%);mix-blend-mode:soft-light}

/* ---------- header ---------- */
.top{display:flex;align-items:center;justify-content:space-between;padding:max(14px,env(safe-area-inset-top)) 16px 10px}
.logo{display:flex;align-items:center;gap:6px;font-family:var(--logo);font-weight:900;font-size:21px;letter-spacing:.03em}
.logo svg{width:22px;height:22px}
.lang{display:flex;align-items:center;gap:6px;height:38px;padding:0 13px;border-radius:19px;font-weight:700;font-size:14px}

/* ---------- home: the map card is the "you're here" ---------- */
.hero{position:relative;display:block;margin:2px 16px 0;height:300px;border-radius:30px;overflow:hidden;background:var(--m-land);box-shadow:0 0 0 1px var(--line),0 12px 30px rgba(19,34,74,.10);transition:transform .2s var(--ease)}
.hero:active{transform:scale(.985)}
.hero .map{position:absolute;inset:0}
.hero .ttl{position:absolute;left:12px;top:12px;max-width:calc(100% - 24px);padding:11px 15px 13px;border-radius:22px;z-index:3}
.hero .ttl .kick,.hero .ttl .h1{width:max-content;max-width:100%}
.kick{display:flex;align-items:center;gap:7px;font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.kick .ok{width:17px;height:17px;border-radius:50%;background:var(--accent);display:grid;place-items:center;color:#fff}
.hero .h1{display:block;font-family:var(--disp);font-weight:800;font-size:27px;line-height:1.05;letter-spacing:-.02em;margin-top:6px;white-space:nowrap}
.go{position:absolute;right:12px;bottom:12px;z-index:3;display:flex;align-items:center;gap:7px;height:40px;padding:0 15px;border-radius:20px;font-weight:700;font-size:14px}
.go.sm{height:34px;padding:0 12px;font-size:13px;right:10px;bottom:10px}
.attr{position:absolute;left:12px;bottom:9px;z-index:3;font-size:9.5px;font-weight:600;color:var(--m-lbl);opacity:.85;-webkit-text-stroke:2.5px var(--m-halo);paint-order:stroke fill;white-space:nowrap}

/* ---------- sections ---------- */
.sec{font-family:var(--disp);font-weight:800;font-size:21px;letter-spacing:-.015em;padding:0 18px;margin:26px 0 12px}
.sec-row{display:flex;align-items:baseline;justify-content:space-between;padding-right:18px}
.note{font-size:11.5px;font-weight:700;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:0 16px}
.tile{position:relative;height:86px;border-radius:20px;background:var(--t);border:2px solid var(--tile-bd);box-shadow:0 4px 0 var(--tile-sh);padding:11px 12px;display:flex;flex-direction:column;justify-content:space-between;color:#13224A;transition:transform .15s var(--ease),box-shadow .15s var(--ease)}
.tile:active{transform:translateY(3px);box-shadow:0 1px 0 var(--tile-sh)}
.tile b{font-size:15.5px;font-weight:700}
.tile .live{position:absolute;right:10px;top:12px;display:flex;align-items:center;gap:5px;font-size:11px;font-weight:800;color:#B4232F}
.live i,.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px rgba(230,57,70,.22);animation:blink 1.6s ease-in-out infinite}
@keyframes blink{50%{box-shadow:0 0 0 5px rgba(230,57,70,.08)}}
.feat{display:flex;gap:12px;overflow-x:auto;padding:0 16px 8px;scroll-snap-type:x mandatory;scrollbar-width:none}
.feat::-webkit-scrollbar,.mcards::-webkit-scrollbar,.chips::-webkit-scrollbar,.strip::-webkit-scrollbar{display:none}
.fcard{display:block;flex:none;width:280px;border-radius:24px;background:var(--surface);box-shadow:0 0 0 1px var(--line);overflow:hidden;scroll-snap-align:start}
.fcard .ph{display:block;position:relative;height:146px;background:#888}
.fcard .ph img{width:100%;height:100%;object-fit:cover}
.feat.top .fcard{width:248px}
.feat.top .fcard .ph{height:112px}
.tag{position:absolute;left:10px;top:10px;padding:4px 9px;border-radius:9px;background:rgba(10,17,36,.78);color:#fff;font-size:10.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase}
.fcard .ft{display:block;padding:12px 14px 14px}
.fcard b{display:block;font-size:17px;font-weight:700}
.fcard .m{display:block;font-size:14px;color:var(--muted);margin-top:2px}
.deal{display:inline-flex;align-items:center;gap:6px;margin-top:9px;padding:5px 10px;border-radius:10px;background:var(--deal-bg);color:var(--deal-ink);font-size:13px;font-weight:700}
.bizline{display:flex;width:calc(100% - 32px);align-items:center;justify-content:space-between;gap:10px;margin:22px 16px 0;padding:15px 16px;border-radius:20px;background:var(--surface);box-shadow:0 0 0 1px var(--line);font-size:14.5px;font-weight:600;text-align:left}
.bizline b{display:flex;align-items:center;gap:2px;color:var(--accent)}
.foot{padding:18px 18px 0;font-size:12px;color:var(--muted);line-height:1.6}
.foot button{text-decoration:underline;font-weight:600;color:var(--ink)}
.tabspace{height:calc(112px + env(safe-area-inset-bottom))}

/* rows */
.list{margin:0 16px;border-radius:22px;background:var(--surface);box-shadow:0 0 0 1px var(--line);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:10px 12px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row img{width:58px;height:58px;border-radius:15px;object-fit:cover;background:#888}
.row .t{flex:1;min-width:0}
.row b{display:block;font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .m{display:block;font-size:13.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.open{color:var(--ok);font-weight:700}
.livetxt{color:var(--accent);font-weight:700}
.walk{flex:none;text-align:center;min-width:44px}
.walk b{font-family:var(--disp);font-size:20px;font-weight:800;line-height:1}
.walk span{display:block;font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}

/* ---------- small maps (pictures of the map; tap one to open the big map) ---------- */
.map{position:relative;overflow:hidden;background:var(--m-land)}
.mapin{position:absolute;left:0;top:0;transform-origin:0 0}
.mapin.lo .m-street-lbl,.mapin.lo .m-hood-lbl,.mapin.lo .m-water-lbl{display:none}
.rmap{display:block}
.rmap .m-land{fill:var(--m-land)}
.rmap .m-park,.rmap .m-park2{fill:var(--m-park)}
.rmap .m-wood{fill:var(--m-wood)}
.rmap .m-water{fill:var(--m-water)}
.rmap .m-case{stroke:var(--m-case)}
.rmap .m-ped{stroke:var(--m-ped)}
.rmap .m-minor{stroke:var(--m-minor)}
.rmap .m-major{stroke:var(--m-major)}
.rmap .m-hw{stroke:var(--m-hw)}
.rmap text{font-family:Inter,sans-serif;paint-order:stroke;stroke:var(--m-halo);stroke-width:3px;stroke-linejoin:round}
.rmap .m-street-lbl{fill:var(--m-lbl)}
.rmap .m-hood-lbl{fill:var(--m-hood);font-size:10.5px;letter-spacing:2.2px;font-weight:800}
.rmap .m-water-lbl{fill:var(--m-water-lbl)}
.ringsvg{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.mk{position:absolute;width:28px;height:28px;margin:-14px 0 0 -14px;border-radius:50%;background:var(--c);border:2px solid var(--pin-bd);display:grid;place-items:center;color:#13224A;box-shadow:0 3px 8px rgba(10,17,36,.28);transform:scale(var(--ik,1));transition:transform .3s var(--spring);z-index:2;cursor:pointer}
.mk.sm{width:22px;height:22px;margin:-11px 0 0 -11px}
.mk.sel{transform:scale(calc(var(--ik,1) * 1.35));z-index:5}
.mk .lb{position:absolute;top:calc(100% + 5px);left:50%;transform:translateX(-50%) scale(.74);transform-origin:top center;white-space:nowrap;padding:4px 9px;border-radius:10px;font-size:13px;font-weight:700;color:var(--ink);background:var(--surface);box-shadow:0 2px 8px rgba(10,17,36,.25)}
.mk.live::after{content:'';position:absolute;inset:-7px;border-radius:50%;border:2px solid var(--accent);animation:ping 1.8s ease-out infinite}
.me{position:absolute;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 3px 12px rgba(10,17,36,.35);transform:scale(var(--ik,1));z-index:4}
.me svg{width:20px;height:20px}
.me::before{content:'';position:absolute;inset:-9px;border-radius:50%;background:rgba(230,57,70,.22);animation:ping 2.2s ease-out infinite}
.ringlbl{position:absolute;transform:translate(-50%,-50%) scale(var(--ik,1));padding:4px 9px;border-radius:10px;font-size:11.5px;font-weight:700;white-space:nowrap;z-index:3;color:var(--ink)}
@keyframes ping{0%{transform:scale(.7);opacity:.9}100%{transform:scale(1.9);opacity:0}}
.pop{animation:pinIn .45s var(--pop) both}
@keyframes pinIn{from{scale:0}}
body.pins-wait .pop{animation-play-state:paused}
.cmapw{position:relative;display:block;margin:14px 16px 0;height:210px;border-radius:24px;overflow:hidden;box-shadow:0 0 0 1px var(--line);transition:transform .2s var(--ease)}
.cmapw:active{transform:scale(.985)}
.cmapw .map{position:absolute;inset:0}

/* ---------- the big map (MapLibre): it grows out of the small map you tap ---------- */
#bigmap{position:fixed;inset:0;z-index:40;visibility:hidden;max-width:480px;margin:0 auto;background:var(--m-land);will-change:clip-path}
#bigmap.on{visibility:visible}
#ml{position:absolute;inset:0}
#bigmap .maplibregl-canvas{outline:none}
.bm-ui{opacity:0;transition:opacity .25s,transform .35s var(--ios);pointer-events:none}
#bigmap.ui .bm-ui{opacity:1;pointer-events:auto;transform:none}
.bm-top{position:absolute;left:0;right:0;top:0;padding:max(12px,env(safe-area-inset-top)) 12px 0;z-index:6;display:flex;gap:8px;align-items:flex-start;transform:translateY(-12px)}
.bm-close{flex:none;width:42px;height:42px;border-radius:50%;display:grid;place-items:center}
.chips{flex:1;display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:none}
.chip{flex:none;height:42px;padding:0 15px;border-radius:21px;display:flex;align-items:center;gap:6px;font-size:14px;font-weight:700}
.chip.on{background:var(--ink);color:var(--bg);border-color:transparent}
.chip.on::after{display:none}
.recenter{position:absolute;right:12px;bottom:calc(214px + env(safe-area-inset-bottom));z-index:6;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;transform:translateY(10px)}
.mcards{position:absolute;left:0;right:0;bottom:calc(92px + env(safe-area-inset-bottom));z-index:6;display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:6px calc(50% - 140px) 10px;scrollbar-width:none;transform:translateY(24px)}
.mcard{flex:none;width:280px;display:flex;align-items:center;gap:12px;padding:10px;border-radius:24px;background:var(--surface);box-shadow:0 10px 26px rgba(10,17,36,.22),0 0 0 1px var(--line);scroll-snap-align:center}
.mcard img{width:64px;height:64px;border-radius:16px;object-fit:cover;background:#888}
.mcard .t{flex:1;min-width:0}
.mcard b{display:block;font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mcard .m{display:block;font-size:13px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bm-attr{position:absolute;right:12px;bottom:calc(200px + env(safe-area-inset-bottom));z-index:5;font-size:9px;font-weight:600;color:var(--m-lbl);-webkit-text-stroke:2.4px var(--m-halo);paint-order:stroke fill;pointer-events:none}
.mlpin{width:28px;height:28px;cursor:pointer;transition:opacity .28s ease}
#bigmap.mk-hide .mlpin:not(.me-w){opacity:0}
.mlpin .mk,.mlpin .me{position:relative;left:auto;top:auto;margin:0}
.mlpin.me-w{width:34px;height:34px;pointer-events:none}
.mlpin.rl-w{width:auto;height:auto;pointer-events:none}
.mlpin .ringlbl{position:relative;transform:none;display:block}
[data-open].wait::before{content:'';position:absolute;left:50%;top:50%;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;border:3px solid rgba(255,255,255,.6);border-top-color:var(--accent);animation:sp .8s linear infinite;z-index:9}
.ldg{position:absolute;inset:0;z-index:7;display:grid;place-items:center;background:color-mix(in srgb,var(--m-land) 70%,transparent);opacity:0;transition:opacity .2s;pointer-events:none}
.ldg.on{opacity:1}
.spin{width:30px;height:30px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(1turn)}}

/* ---------- list / today / place ---------- */
.ptop{display:flex;align-items:center;gap:10px;padding:max(14px,env(safe-area-inset-top)) 16px 4px}
.back{width:42px;height:42px;border-radius:50%;display:grid;place-items:center}
.ptitle{padding:6px 18px 0}
.ptitle h1{font-family:var(--disp);font-weight:800;font-size:34px;letter-spacing:-.02em;display:flex;align-items:center;gap:10px}
.ptitle h1 .bub{width:44px;height:44px;border-radius:14px;background:var(--t);border:2px solid var(--tile-bd);display:grid;place-items:center;color:#13224A}
.ptitle p{font-size:15px;color:var(--muted);margin-top:6px}
.wide{display:flex;gap:12px;align-items:center;margin:0 16px;padding:10px;border-radius:22px;background:var(--surface);box-shadow:0 0 0 1px var(--line)}
.wide img{width:84px;height:84px;border-radius:16px;object-fit:cover}
.wide b{display:block;font-size:17px;font-weight:700}
.wide .m{display:block;font-size:13.5px;color:var(--muted);margin-top:3px;line-height:1.4}
.hero-ph{position:relative;height:300px;background:#777}
.hero-ph img{width:100%;height:100%;object-fit:cover}
.hero-ph .back{position:absolute;left:16px;top:max(14px,env(safe-area-inset-top))}
.hero-ph .tag{left:auto;right:16px;top:calc(max(14px,env(safe-area-inset-top)) + 8px)}
.pl-body{position:relative;margin-top:-26px;background:var(--bg);border-radius:28px 28px 0 0;padding:22px 18px 30px}
.pl-body h1{font-family:var(--disp);font-weight:800;font-size:31px;letter-spacing:-.02em;line-height:1.05}
.pl-body>.m{font-size:15px;color:var(--muted);margin-top:6px}
.dealbig{display:flex;align-items:center;gap:12px;margin-top:16px;padding:14px;border-radius:18px;background:var(--pink);border:2px solid var(--tile-bd);box-shadow:0 4px 0 var(--tile-sh);color:#13224A}
.dealbig .gi{width:42px;height:42px;border-radius:12px;background:#fff;border:2px solid #13224A;display:grid;place-items:center;color:#E63946;flex:none}
.dealbig b{display:block;font-size:16px}
.dealbig span{display:block;font-size:13.5px;color:#4A3440;margin-top:1px}
.acts{display:grid;grid-template-columns:1.25fr .8fr 1.15fr;gap:10px;margin-top:16px}
.act{height:54px;border-radius:17px;background:var(--surface);box-shadow:0 0 0 1px var(--line);display:flex;align-items:center;justify-content:center;gap:7px;font-weight:700;font-size:15px}
.act.pri{background:var(--ink);color:var(--bg);box-shadow:none}
.pmapw{position:relative;display:block;margin-top:16px;height:170px;border-radius:22px;overflow:hidden;box-shadow:0 0 0 1px var(--line)}
.pmapw .map{position:absolute;inset:0}
.pmapw .wk{position:absolute;left:10px;top:10px;z-index:6;display:flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:17px;font-weight:700;font-size:13.5px}
.about{font-size:16px;line-height:1.5;margin-top:16px;opacity:.9}
.strip{display:flex;gap:8px;margin:16px -18px 0;padding:0 18px;overflow-x:auto;scrollbar-width:none}
.strip img{flex:none;width:150px;height:112px;border-radius:16px;object-fit:cover}
.facts{margin-top:16px;border-radius:18px;background:var(--surface);box-shadow:0 0 0 1px var(--line)}
.fact{display:flex;gap:12px;align-items:center;padding:13px 14px;border-top:1px solid var(--line);font-size:15px}
.fact:first-child{border-top:0}
.fact .ic{color:var(--muted)}
.fact span{flex:1}
.fact small{color:var(--muted);font-size:13.5px}

/* ---------- tab bar ---------- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;gap:10px;align-items:center;max-width:480px;margin:0 auto;padding:0 14px calc(12px + env(safe-area-inset-bottom));pointer-events:none;transition:transform .35s var(--ease),opacity .25s}
.tabbar>*{pointer-events:auto}
.tabbar.hide{transform:translateY(130%);opacity:0}
.caps{flex:1;height:66px;border-radius:33px;display:grid;grid-template-columns:repeat(3,1fr);padding:5px}
.lens{position:absolute;left:5px;top:5px;bottom:5px;width:calc((100% - 10px) / 3);border-radius:28px;background:var(--lens);box-shadow:var(--lens-shadow);z-index:0}
.tab{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--tab-ink);font-size:11px;font-weight:700;letter-spacing:.01em;transition:color .25s}
.tab.on{color:var(--tab-on)}
.tab .badge{position:absolute;top:8px;left:calc(50% + 8px);width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px var(--surface)}
.sbtn{flex:none;width:66px;height:66px;border-radius:50%;display:grid;place-items:center;color:var(--ink)}

/* ---------- search ---------- */
.ssheet{position:fixed;inset:0;z-index:80;max-width:480px;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) 16px 20px;background:color-mix(in srgb,var(--bg) 82%,transparent);-webkit-backdrop-filter:blur(26px) saturate(1.6);backdrop-filter:blur(26px) saturate(1.6);opacity:0;transform:translateY(16px);pointer-events:none;transition:opacity .22s,transform .3s var(--ease);overflow-y:auto}
.ssheet.on{opacity:1;transform:none;pointer-events:auto}
.sfield{display:flex;gap:10px;align-items:center}
.sfield label{flex:1;display:flex;align-items:center;gap:10px;height:50px;padding:0 16px;border-radius:25px;color:var(--muted)}
.sfield input{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:16.5px;color:var(--ink);outline:0}
.sfield button{font-weight:700;font-size:15px;color:var(--accent);padding:0 4px}
.sugs{display:flex;flex-wrap:wrap;gap:8px;margin:16px 2px 6px}
.sugs .chip{height:38px}
.ssheet .list{margin:14px 0 0}
.empty{padding:26px 6px;text-align:center;color:var(--muted);font-size:15px}

/* home content waits under the intro */
body.intro-on .rise{opacity:0;transform:translateY(18px)}
body.intro-on .tabbar{opacity:0;transform:translateY(40px)}

/* ---------- the scan intro ---------- */
#intro{position:fixed;inset:0;z-index:100;background:#13224A;color:#fff;overflow:hidden}
#intro .stage{position:absolute;left:0;right:0;top:50%;transform:translateY(-62%);display:flex;flex-direction:column;align-items:center;text-align:center}
#intro .glow{position:absolute;left:50%;top:50%;width:560px;height:560px;margin:-280px 0 0 -280px;border-radius:50%;background:radial-gradient(circle,rgba(230,57,70,.22),rgba(230,57,70,0) 62%);opacity:0;animation:fadeIn .8s .9s var(--ease) forwards}
.qrwrap{position:relative;width:176px;height:176px;padding:14px;border-radius:30px;background:#fff;animation:qrIn .35s var(--ease) both,qrOut .3s .9s cubic-bezier(.5,0,.75,0) forwards}
.qrsvg{width:100%;height:100%}
.qrsvg .qm,.qrsvg .qc{fill:#13224A}
.qrsvg .qf{stroke:#13224A}
.scanline{position:absolute;left:8px;right:8px;top:12px;height:4px;border-radius:2px;background:#E63946;box-shadow:0 0 14px 3px rgba(230,57,70,.65);animation:scan .62s .2s ease-in-out both}
.qrcheck{position:absolute;inset:0;border-radius:30px;animation:flash .3s .78s ease-out both}
.mark{position:relative;display:flex;align-items:center;gap:12px;font-family:var(--logo);font-weight:900;font-size:50px;letter-spacing:.03em;line-height:1;margin-top:-176px;height:176px}
.mark .hI,.mark .hB{opacity:0;position:relative;z-index:1}
.mark .hI{animation:fromL .45s 1.34s var(--ease) forwards}
.mark .hB{animation:fromR .5s 1.38s var(--ease) forwards}
.mark .heart{position:relative;z-index:2;width:54px;height:54px;transform:translateX(var(--hx,0)) scale(0);animation:heartPop .55s .95s var(--pop) forwards,heartSlide .48s 1.25s var(--ease) forwards,beat .5s 2.15s ease-in-out}
.mark .heart svg{width:100%;height:100%;overflow:visible}
.iping{position:absolute;left:50%;top:50%;width:60px;height:60px;margin:-30px 0 0 -30px;border-radius:50%;border:3px solid #E63946;opacity:0;transform:scale(.6);animation:iping 1s 1s ease-out}
#intro .kick{color:rgba(255,255,255,.72)}
.ikick{margin-top:22px;opacity:0;animation:up .45s 1.62s var(--ease) forwards}
.ititle{font-family:var(--disp);font-weight:800;font-size:40px;letter-spacing:-.02em;line-height:1.05;margin-top:10px;white-space:nowrap;opacity:0;animation:up .5s 1.76s var(--ease) forwards}
.isub{font-size:16px;color:rgba(255,255,255,.75);margin-top:12px;opacity:0;animation:up .45s 1.95s var(--ease) forwards}
.skip{position:absolute;right:16px;bottom:calc(22px + env(safe-area-inset-bottom));height:36px;padding:0 14px;border-radius:18px;background:rgba(255,255,255,.12);color:rgba(255,255,255,.85);font-size:13.5px;font-weight:700;opacity:0;animation:fadeIn .4s .6s forwards}
#intro.fast *{animation-duration:.01s!important;animation-delay:0s!important}
#intro.fast .qrwrap,#intro.fast .scanline,#intro.fast .iping{display:none}
@keyframes qrIn{from{opacity:0;transform:scale(.85)}}
@keyframes qrOut{to{opacity:0;transform:scale(.15) rotate(-8deg)}}
@keyframes scan{0%{top:12px;opacity:0}12%{opacity:1}88%{opacity:1}100%{top:calc(100% - 16px);opacity:0}}
@keyframes flash{0%{background:rgba(255,255,255,0)}40%{background:rgba(255,255,255,.85)}100%{background:rgba(255,255,255,0)}}
@keyframes heartPop{0%{transform:translateX(var(--hx,0)) scale(0)}60%{transform:translateX(var(--hx,0)) scale(1.3)}100%{transform:translateX(var(--hx,0)) scale(1)}}
@keyframes heartSlide{from{transform:translateX(var(--hx,0)) scale(1)}to{transform:translateX(0) scale(1)}}
@keyframes beat{0%,100%{transform:scale(1)}30%{transform:scale(1.18)}60%{transform:scale(.96)}}
@keyframes iping{0%{opacity:.7;transform:scale(.6)}100%{opacity:0;transform:scale(4.2)}}
@keyframes fromL{from{opacity:0;transform:translateX(10px)}to{opacity:1;transform:none}}
@keyframes fromR{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes fadeIn{to{opacity:1}}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translate(-50%,16px);max-width:calc(100% - 32px);padding:12px 16px;border-radius:16px;background:var(--ink);color:var(--bg);font-size:14px;font-weight:600;opacity:0;transition:.25s var(--ease);z-index:90;pointer-events:none;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){#intro{display:none}body.intro-on .rise,body.intro-on .tabbar{opacity:1;transform:none}.mk.live::after,.me::before,.live i,.dot{animation:none}}

      await bigEl.animate([{ clipPath: 'inset(0px 0px 0px 0px round 0px)' }, { clipPath: insetOf(sc.rect) }], { duration: D_CLOSE, easing: 'cubic-bezier(.3,.8,.2,1)', fill: 'forwards' }).finished;
      if (bigOpen) return;
      await bigEl.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 170, easing: 'ease-out', fill: 'forwards' }).finished;
    } else {
      await bigEl.animate([{ opacity: 1, transform: 'none' }, { opacity: 0, transform: 'scale(.97)' }], { duration: 240, easing: 'cubic-bezier(.4,0,.2,1)', fill: 'forwards' }).finished;
    }
    if (bigOpen) return;
    bigEl.classList.remove('on', 'mk-hide');
    bigEl.getAnimations().forEach((a) => a.cancel());
    bigEl.style.clipPath = '';
  }

  /* ---------- router + tabs ---------- */
  const app = document.getElementById('app'), tabbar = document.getElementById('tabbar'), lens = document.getElementById('lens');
  let tabNow = 0, under = null, pendingFrom = null, navs = 0;
  function moveLens(i, animate) {
    const from = tabNow; tabNow = i;
    document.querySelectorAll('.tab').forEach((t) => t.classList.toggle('on', +t.dataset.tab === i));
    const end = `translateX(${i * 100}%)`;
    if (animate && from !== i && lens.animate) {
      const mid = ((from + i) / 2) * 100;
      lens.animate([{ transform: `translateX(${from * 100}%)` }, { transform: `translateX(${mid}%) scale(1.14,.9)`, offset: 0.45 }, { transform: end }], { duration: 520, easing: 'cubic-bezier(.3,1.25,.5,1)' });
    }
    lens.style.transform = end;
  }
  const pageMap = () => document.querySelector('#app [data-open] .map');
  function renderPage(hash) {
    const h = hash.replace(/^#\/?/, '').split('/');
    let tab = 0;
    if (h[0] === 'c') app.innerHTML = listPage(h[1]);
    else if (h[0] === 'p') app.innerHTML = placePage(h[1]);
    else if (h[0] === 'today') { app.innerHTML = todayTab(); tab = 2; }
    else app.innerHTML = home();
    under = h[0] === 'c' || h[0] === 'p' || h[0] === 'today' ? '#/' + h.join('/') : '#/';
    tabbar.classList.toggle('hide', h[0] === 'p');
    window.scrollTo(0, 0);
    hydrate();
    setTimeout(prepCam, 60);
    const r = document.getElementById('replay');
    if (r) r.onclick = () => { sessionStorage.removeItem('ilb-intro'); location.reload(); };
    return tab;
  }
  function route() {
    if (/^#\/(looks|place|live|credits|business|spots)\b/.test(location.hash)) { location.replace('/iloveboston/full.html' + location.hash); return; }
    const hash = location.hash || '#/';
    const h = hash.replace(/^#\/?/, '').split('/');
    const iv = document.getElementById('intro');
    if (iv && h[0] && h[0] !== 'mockups') { iv.remove(); document.body.classList.remove('intro-on', 'pins-wait'); }
    if (h[0] === 'map') {
      if (under === null) renderPage('#/');
      const from = pendingFrom || pageMap(); pendingFrom = null;
      moveLens(1, true);
      tabbar.classList.remove('hide');
      openBig(h[1] === 'p' ? '' : (h[1] || ''), h[1] === 'p' ? h[2] : '', from);
      return;
    }
    const target = '#/' + h.filter(Boolean).join('/');
    if (bigOpen && (target === under || (target === '#/' && under === '#/'))) {
      moveLens(under.startsWith('#/today') ? 2 : 0, true);
      tabbar.classList.toggle('hide', under.startsWith('#/p/'));
      closeBig(pageMap());
      return;
    }
    const tab = renderPage(hash);
    moveLens(tab, true);
    if (bigOpen) closeBig(pageMap());
  }
  document.addEventListener('click', (e) => {
    if (e.target.closest('[data-back]')) { if (navs > 0) history.back(); else location.hash = '#/'; return; }
    const op = e.target.closest('[data-open]');
    if (op) pendingFrom = op.querySelector('.map');
    const tab = e.target.closest('.tab[data-tab="1"]');
    if (tab) pendingFrom = pageMap();
  }, true);
  let tt;
  document.addEventListener('click', (e) => { const b = e.target.closest('[data-toast]'); if (!b) return; let t = document.querySelector('.toast'); if (!t) { t = document.createElement('div'); t.className = 'toast'; document.body.appendChild(t); } t.textContent = b.dataset.toast; t.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), 2200); });
  window.addEventListener('hashchange', () => { navs++; route(); });
  route();
  // get the big map ready in the background once the page has settled, so it opens at once
  const warm = () => setTimeout(() => ensureMap().catch(() => {}), 1200);
  if (document.readyState === 'complete') warm(); else addEventListener('load', warm);
  window.__map = () => map;
  window.__openBig = openBig;
  window.__bm = { staticCam, goalCam, insetOf, setPins, pageMap, el: bigEl, ease: OPEN };

  /* ---------- search ---------- */
  const sheet = document.getElementById('ssheet'), sq = document.getElementById('sq'), sres = document.getElementById('sres');
  const SUGS = ['Bar', 'Sushi', 'Flowers', 'Books', 'Phone repair', 'History', 'Live now'];
  function searchRender() {
    const q = sq.value.trim().toLowerCase();
    if (!q) { sres.innerHTML = `<div class="sugs">${SUGS.map((s) => `<button type="button" class="chip glass" data-s="${s}">${s}</button>`).join('')}</div>`; return; }
    const hits = P.filter((p) => (p.name + ' ' + p.kind + ' ' + (CAT[p.cat] || {}).label + (p.live ? ' live now' : '')).toLowerCase().includes(q.replace(/s$/, '')));
    sres.innerHTML = hits.length ? `<div class="list">${hits.map(row).join('')}</div>` : `<p class="empty">Nothing called “${sq.value.replace(/[<>&]/g, '')}” near this sign yet.</p>`;
  }
  const openSearch = () => { sheet.classList.add('on'); sheet.setAttribute('aria-hidden', 'false'); searchRender(); setTimeout(() => sq.focus(), 60); };
  const closeSearch = () => { sheet.classList.remove('on'); sheet.setAttribute('aria-hidden', 'true'); sq.blur(); };
  document.getElementById('openSearch').onclick = openSearch;
  document.getElementById('closeSearch').onclick = () => { sq.value = ''; closeSearch(); };
  sq.addEventListener('input', searchRender);
  sres.addEventListener('click', (e) => { const s = e.target.closest('[data-s]'); if (s) { sq.value = s.dataset.s; searchRender(); return; } if (e.target.closest('a')) closeSearch(); });

  /* ----- the intro: plays when you arrive from a sign's QR code ----- */
  const intro = document.getElementById('intro');
  const onHome = !location.hash || location.hash === '#/';
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!intro || !onHome || reduce || (!CAPTURE && !Q.has('intro') && !fromMockups && sessionStorage.getItem('ilb-intro'))) { if (intro) intro.remove(); document.body.classList.remove('intro-on', 'pins-wait'); return; }
  sessionStorage.setItem('ilb-intro', '1');
  const heart = document.getElementById('iHeart');
  const placeHeart = () => {
    const mk = heart.parentElement.getBoundingClientRect();
    intro.style.setProperty('--hx', (innerWidth / 2 - (mk.left + heart.offsetLeft + heart.offsetWidth / 2)).toFixed(1) + 'px');
  };
  placeHeart();
  document.fonts && document.fonts.ready.then(placeHeart);
  let morphing = false;
  function morph(paused) {
    if (morphing) return; morphing = true;
    const hero = document.getElementById('hero');
    if (!hero) { const a = intro.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 250, fill: 'forwards' }); a.finished.then(() => { document.body.classList.remove('intro-on', 'pins-wait'); intro.remove(); }); return [a]; }
    const hr = hero.getBoundingClientRect();
    const W = innerWidth, H = innerHeight, dur = 640, ease = 'cubic-bezier(.65,0,.35,1)';
    const anims = [];
    anims.push(intro.animate([{ clipPath: 'inset(0px 0px 0px 0px round 0px)' }, { clipPath: `inset(${hr.top}px ${W - hr.right}px ${H - hr.bottom}px ${hr.left}px round 30px)` }], { duration: dur, easing: ease, fill: 'forwards' }));
    anims.push(intro.animate([{ backgroundColor: 'rgba(19,34,74,1)' }, { backgroundColor: 'rgba(19,34,74,0)' }], { duration: 320, delay: dur - 60, easing: 'ease-out', fill: 'forwards' }));
    [['iTitle', 'heroTitle'], ['iKick', 'heroKick']].forEach(([a, b]) => {
      const ea = document.getElementById(a), eb = document.getElementById(b);
      const ra = ea.getBoundingClientRect(), rb = eb.getBoundingClientRect();
      const s = rb.width / ra.width, to = getComputedStyle(eb).color;
      ea.style.transformOrigin = '0 0';
      anims.push(ea.animate([{ transform: 'none', color: getComputedStyle(ea).color }, { transform: `translate(${rb.left - ra.left}px,${rb.top - ra.top}px) scale(${s})`, color: to }], { duration: dur, easing: ease, fill: 'forwards' }));
      anims.push(ea.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 160, delay: dur - 20, fill: 'forwards' }));
    });
    intro.querySelectorAll('.mark,.isub,.skip,.glow').forEach((el) => anims.push(el.animate([{ opacity: getComputedStyle(el).opacity }, { opacity: 0 }], { duration: 260, easing: 'ease-out', fill: 'forwards' })));
    document.querySelectorAll('.rise,.tabbar').forEach((el, i) => anims.push(el.animate([{ opacity: 0, transform: 'translateY(18px)' }, { opacity: 1, transform: 'none' }], { duration: 480, delay: 300 + Math.min(i, 6) * 55, easing: 'cubic-bezier(.2,.8,.2,1)', fill: 'forwards' })));
    hero.querySelectorAll('.ttl,.go').forEach((el) => anims.push(el.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 220, delay: dur - 120, fill: 'backwards' })));
    const finish = () => { document.body.classList.remove('intro-on'); intro.remove(); };
    anims.forEach((a) => { const t = a.effect && a.effect.target; if (t && (t.classList.contains('rise') || t.classList.contains('tabbar'))) a.finished.then(() => a.cancel()); });
    Promise.all([anims[0].finished, anims[1].finished]).then(finish);
    if (!paused) setTimeout(() => document.body.classList.remove('pins-wait'), dur - 60);
    if (paused) anims.forEach((a) => a.pause());
    window.__morphAnims = anims;
    return anims;
  }
  window.__morph = morph;
  window.__finishIntro = () => { document.body.classList.remove('intro-on'); intro.remove(); };
  window.__pinsGo = () => document.body.classList.remove('pins-wait');
  intro.addEventListener('click', () => { intro.classList.add('fast'); setTimeout(() => morph(), 40); });
  if (!CAPTURE) setTimeout(() => morph(), 2500);
})();
</script>
