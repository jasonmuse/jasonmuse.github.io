*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:var(--body)}
body{font-family:var(--font);color:var(--ink);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;-webkit-appearance:none;appearance:none}
a{color:var(--ink)}
h1,h2,h3,p{margin:0}
#safe{position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
#app{position:relative;width:100%;max-width:430px;height:100vh;height:100dvh;margin:0 auto;overflow:hidden;background:var(--app)}
@media (min-width:600px) and (min-height:720px){body{display:flex;align-items:center;justify-content:center}#app{height:min(860px,calc(100dvh - 48px));border-radius:34px;box-shadow:0 30px 80px rgba(11,22,48,.35)}}
#app.instant *{transition:none!important}
.scr{position:absolute;inset:0;overflow:hidden}
.muted{color:var(--muted)}
.small{font-size:12px;line-height:1.45}
.center{text-align:center}
.pb{padding-bottom:110px}
.nowred{color:var(--now)!important}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);margin:26px 20px 2px}
.eyebrow.light{color:var(--on-navy2);margin:0;font-size:12px;letter-spacing:.8px}
.tinted{background:var(--tint);color:var(--tink)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tinted{background:color-mix(in srgb,var(--tink) 26%,#141A25);color:color-mix(in srgb,var(--tink) 45%,#fff)}}
:root[data-theme="dark"] .tinted{background:color-mix(in srgb,var(--tink) 26%,#141A25);color:color-mix(in srgb,var(--tink) 45%,#fff)}
@keyframes ilbPulse{0%{box-shadow:0 0 0 0 rgba(215,38,61,.5),0 2px 6px var(--shadow2)}70%{box-shadow:0 0 0 14px rgba(215,38,61,0),0 2px 6px var(--shadow2)}100%{box-shadow:0 0 0 0 rgba(215,38,61,0),0 2px 6px var(--shadow2)}}
@keyframes ilbDot{0%{box-shadow:0 0 0 0 rgba(215,38,61,.45)}70%{box-shadow:0 0 0 7px rgba(215,38,61,0)}100%{box-shadow:0 0 0 0 rgba(215,38,61,0)}}
.pulse{animation:ilbPulse 2.2s ease-out infinite}
.pdot{animation:ilbDot 2s ease-out infinite}
@media (prefers-reduced-motion:reduce){.pulse,.pdot{animation:none}.world,.sheet,.recenter{transition:none!important}}

/* ---- map ---- */
.map{position:absolute;inset:0;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
.map.grabbing{cursor:grabbing}
.world{position:absolute;left:0;top:0;width:0;height:0;transform-origin:0 0;transition:transform .45s var(--ease)}
.world.nodrag{transition:none;will-change:transform}
/* markers stay the same size while the map zooms: the world scales by k, they scale by 1/k */
.pin,.livepin,.phpin{transform:scale(var(--ik,1))}
.me{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:rgba(31,91,216,.16);transform:scale(var(--ik,1));pointer-events:none}
.me::after{content:"";position:absolute;left:14px;top:14px;width:16px;height:16px;box-sizing:border-box;border-radius:50%;border:3px solid #fff;background:var(--m-me);box-shadow:0 1px 3px rgba(0,0,0,.25)}
.wsvg{position:absolute;left:-260px;top:-300px;display:block;pointer-events:none}
.wsvg [fill="#CFE5D2"],.trailmap [fill="#CFE5D2"]{fill:var(--m-park)}
.wsvg [fill="#D7EBDA"]{fill:var(--m-park2)}
.wsvg [fill="#CFE1F2"],.trailmap [fill="#CFE1F2"]{fill:var(--m-water)}
.wsvg g[stroke="#D3D9E1"]{stroke:var(--m-casing)}
.wsvg g[stroke="#FFFFFF"]{stroke:var(--m-street)}
.wsvg [fill="#6B7484"]{fill:var(--m-lbl)}
.wsvg [fill="#7B8494"]{fill:var(--m-hood)}
.wsvg [fill="#2F6B43"]{fill:var(--m-lpark)}
.wsvg [fill="#3E6A93"],.trailmap [fill="#3E6A93"]{fill:var(--m-lwater)}
.wsvg [stroke="#13254A"]{stroke:var(--m-ring)}
.wsvg [fill="#3C4A63"]{fill:var(--m-ringlbl)}
.wsvg [stroke="#E9EDF2"],.trailmap [stroke="#E9EDF2"]{stroke:var(--m-halo)}
.wsvg [fill="#1F5BD8"]{fill:var(--m-me)}
.trailmap [fill="#13254A"]{fill:var(--ink)}
.chip-st{position:absolute;transform:scale(var(--ik,1));transform-origin:0 50%;display:flex;align-items:center;gap:3px;padding:3px 6px 3px 4px;border-radius:999px;background:var(--chipst);color:var(--ink);box-shadow:0 0 0 1px var(--edge),0 1px 4px var(--shadow2);font-size:10.5px;font-weight:700;white-space:nowrap;pointer-events:none}
.dot8{width:8px;height:8px;border-radius:4px}
.pin{position:absolute;padding:0;border-radius:50%;border:2px solid var(--pin-bd);background:var(--pin-plain);color:#fff;font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px var(--shadow2);cursor:pointer}
.pin.on{background:var(--pick);font-size:14px;box-shadow:0 0 0 5px rgba(76,141,255,.28),0 4px 10px var(--shadow2)}
.pin.cpin.on{box-shadow:0 0 0 3px var(--pin-bd),0 0 0 7px var(--dot),0 4px 10px var(--shadow2)}
.flagpin{position:absolute;transform:translate(-50%,-100%) scale(var(--ik,1));transform-origin:50% 100%;display:flex;flex-direction:column;align-items:center;padding:0;border:0;background:transparent;filter:drop-shadow(0 2px 3px var(--shadow2));cursor:pointer}
.fp{display:flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:12px;background:var(--flag-bg);color:#fff;font-weight:700;font-size:11.5px;white-space:nowrap}
.fp.on{background:var(--pick)}
.fpdot{flex:none;width:7px;height:7px;border-radius:4px;background:#FF5A6E}
.tail{width:0;height:0;margin-top:-1px;border-left:6px solid transparent;border-right:6px solid transparent;border-top:7px solid var(--flag-bg)}
.tail.on{border-top-color:var(--pick)}
.livepin{position:absolute;padding:0;border-radius:50%;border:3px solid var(--pin-bd);background:var(--live);box-shadow:0 2px 6px var(--shadow2);cursor:pointer}
.livepin.on{box-shadow:0 0 0 5px rgba(76,141,255,.3),0 4px 10px var(--shadow2)}
.spot{position:absolute;transform:translate(-50%,-50%) scale(var(--ik,1));display:flex;align-items:center;gap:4px;height:24px;padding:0 8px 0 7px;border-radius:12px;border:1.5px solid var(--red);background:var(--surface);box-shadow:0 1px 4px var(--shadow2);color:var(--ink);text-decoration:none;font-size:10.5px;font-weight:800;letter-spacing:.5px;white-space:nowrap}

/* ---- top bar ---- */
.topbar{position:absolute;left:0;right:0;top:0;z-index:5;display:flex;justify-content:space-between;padding:max(12px,env(safe-area-inset-top)) 12px 0;pointer-events:none}
.pillw{pointer-events:auto;display:flex;align-items:center;height:44px;border-radius:22px;background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--edge),0 4px 14px var(--shadow)}
.logo{gap:5px;padding:0 16px;font-family:var(--head);font-weight:800;font-size:16px;letter-spacing:.4px}
.langbtn{gap:8px;padding:0 14px;border:0;font-weight:700;font-size:13px;cursor:pointer}
.demobtn{gap:6px;padding:0 12px;border:0;font-weight:700;font-size:13px;cursor:pointer}
.flag{flex:none;display:block;width:21px;height:14px;border-radius:3px;overflow:hidden;box-shadow:0 0 0 1px rgba(19,37,74,.14)}
.flag svg{display:block;width:100%;height:100%}
.recenter{position:absolute;right:12px;z-index:6;width:44px;height:44px;padding:0;border:0;border-radius:22px;background:var(--surface);color:var(--pick);box-shadow:0 0 0 1px var(--edge),0 4px 14px var(--shadow);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:top .35s var(--ease)}

/* ---- the sheet ---- */
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:7;overflow:hidden;background:var(--surface);border-radius:24px 24px 0 0;box-shadow:0 -10px 30px var(--shadow);transition:top .35s var(--ease)}
.sheet.nodrag{transition:none}
.sheet-list{position:absolute;inset:0;display:flex;flex-direction:column}
.sh-head{flex:none;position:relative;display:flex;align-items:center;gap:12px;padding:18px 16px 12px 20px;background:var(--navy-surface);color:var(--on-navy);touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
.handle-btn{position:absolute;left:50%;top:0;width:120px;height:24px;margin-left:-60px;padding:0;border:0;border-radius:0 0 12px 12px;background:transparent;cursor:pointer}
.handle{position:absolute;left:50%;top:7px;width:36px;height:4px;margin-left:-18px;border-radius:2px;background:rgba(255,255,255,.35);pointer-events:none}
.handle-btn:hover .handle,.handle-btn:focus-visible .handle{background:rgba(255,255,255,.7)}
.sh-title{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px;padding:2px 0;border:0;background:transparent;color:var(--on-navy);text-align:left;cursor:pointer}
.cap{font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--on-navy2)}
.ttl{font-family:var(--head);font-weight:800;font-size:20px;white-space:nowrap}
.dtc-slot{flex:none;display:flex}
.dtc{flex:none;display:flex;align-items:center;gap:5px;height:40px;padding:0 8px 0 11px;border:1px solid rgba(255,255,255,.4);border-radius:10px;color:#fff!important;text-decoration:none;font-size:12px;font-weight:700;letter-spacing:1px}
.dtc.static{opacity:.85}
.tabs{flex:none;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;margin:12px 16px 4px;padding:4px;border-radius:14px;background:var(--surface3)}
.tab{display:flex;align-items:center;justify-content:center;gap:7px;min-width:0;height:40px;padding:0 4px;border:0;border-radius:10px;background:transparent;color:var(--muted);font-weight:700;font-size:13.5px;white-space:nowrap;overflow:hidden;cursor:pointer}
.tab span:last-child{overflow:hidden;text-overflow:ellipsis}
.tab[aria-selected="true"]{background:var(--tabsel);color:var(--ink);box-shadow:0 1px 3px var(--shadow)}
.ldot{flex:none;display:inline-block;width:8px;height:8px;border-radius:4px;background:var(--live)}
.sh-body{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.chips{display:flex;gap:6px;padding:2px 16px 0;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:44px;padding:0;border:0;background:transparent;cursor:pointer}
.chip span{display:flex;align-items:center;height:34px;padding:0 14px;border-radius:999px;border:1px solid var(--chipbd);background:var(--surface);color:var(--ink);font-weight:600;font-size:13.5px;white-space:nowrap}
.chip[aria-pressed="true"] span{background:var(--sel);border-color:var(--sel);color:var(--on-sel)}
.cdot{display:inline-block;flex:none;width:8px;height:8px;margin-right:6px;border-radius:4px;vertical-align:1px}
.line{position:relative;margin:4px 20px 0}
.rail{position:absolute;top:31px;bottom:31px;width:3px;border-radius:2px;background:var(--rail)}
.mark{position:relative;display:flex;align-items:center;height:30px}
.mark::before{content:"";position:absolute;left:0;right:0;top:14px;border-top:1.5px dashed var(--dash)}
.mark span{position:relative;margin-left:var(--ml,84px);padding:0 8px;background:var(--surface);font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--muted)}
.row{position:relative;display:flex;align-items:center;width:100%;min-height:62px;padding:0;border:0;background:transparent;text-align:left;color:var(--ink);cursor:pointer}
.row .tcol{flex:none;width:48px;text-align:right;font-size:13px;font-weight:800}
.row .lcol{flex:none;width:32px;display:flex;justify-content:center}
.stop{width:24px;height:24px;border-radius:12px;border:2.5px solid var(--rail);background:var(--surface);color:var(--ink);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800}
.row .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;padding:8px 0 8px 6px}
.nm{display:flex;align-items:center;gap:6px;min-width:0}
.nm b{font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp{flex:none;align-self:flex-start;font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--sp-fg);background:var(--sp-bg);padding:2px 6px;border-radius:5px}
.nm .sp{align-self:center}
.sp.big{font-size:11px;letter-spacing:.6px;padding:5px 9px;border-radius:6px}
.sub{font-size:13px;color:var(--muted)}
.row.ev{min-height:64px}
.row.ev .tcol{width:58px;display:flex;flex-direction:column;align-items:flex-end;gap:1px}
.wd{font-size:10.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--muted)}
.tm{font-size:13px;font-weight:800}
.tilll{font-size:10.5px;font-weight:600;color:var(--muted);white-space:nowrap}
.estop{width:14px;height:14px;border-radius:7px;border:2.5px solid var(--rail);background:var(--surface)}
.estop.now{border-color:var(--live);background:var(--live)}
.evprice{font-weight:700}
.evprice.free{color:var(--green)}
.note{margin:12px 20px 0;font-size:13px;color:var(--muted)}
.note.small{font-size:12px}
.plist{margin:4px 20px 0}
.prow{display:flex;align-items:center;gap:12px;width:100%;min-height:64px;padding:0;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;color:var(--ink);cursor:pointer}
.prow .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;padding:8px 0}
.pnum{flex:none;width:26px;height:26px;border-radius:13px;background:var(--pin-plain);color:#fff;font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center}
.pmin{flex:none;font-size:13px;font-weight:600;color:var(--muted)}
.tsec{margin:28px 20px 0}
.tsec-h{display:flex;align-items:center;gap:8px}
.tsec-h h3{font-family:var(--head);font-weight:800;font-size:16px}
.tlist{margin:6px 0 4px}
.st{border-top:1px solid var(--line)}
.st-row{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;padding:0;border:0;background:transparent;text-align:left;color:var(--ink);cursor:pointer}
.st-name{flex:1;min-width:0;font-weight:600;font-size:15px}
.st-lines{display:flex;gap:4px}
.lp{font-size:11px;font-weight:700;padding:2px 7px;border-radius:5px}
.st-walk{flex:none;width:44px;text-align:right;font-size:13px;font-weight:700}
.chev{flex:none;display:flex;color:var(--muted);transition:transform .2s}
.chev.open{transform:rotate(90deg)}
.trains{margin:0 0 12px;padding:2px 12px;border-radius:14px;background:var(--surface2)}
.tr{display:flex;align-items:center;gap:10px;min-height:48px;border-top:1px solid var(--line2)}
.tr:first-child{border-top:0}
.tbar{flex:none;width:4px;height:28px;border-radius:2px}
.tto{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.tl{font-size:10.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--muted)}
.td{font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t1{flex:none;font-size:14px;font-weight:800}
.t2{flex:none;width:44px;text-align:right;font-size:13px;font-weight:600;color:var(--muted)}
.cta-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:24px 20px 0;min-height:52px;padding:0 16px;border-radius:14px;background:var(--surface2);color:var(--ink);text-decoration:none;font-weight:700;font-size:14px}
.livecount{display:flex;align-items:center;gap:9px;padding:8px 20px 0;font-size:14px;font-weight:600}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 12px;padding:14px 20px 0}
.tile{display:flex;flex-direction:column;gap:8px;min-width:0;padding:0;border:0;background:transparent;text-align:left;color:var(--ink);cursor:pointer}
.tile-media{position:relative;display:block;width:100%;height:150px;border-radius:16px;overflow:hidden}
.tile-media img,.vmedia img{position:absolute;inset:0;display:block;width:100%;height:100%;object-fit:cover}
.livebadge{position:absolute;left:8px;top:8px;font-size:10px;font-weight:700;letter-spacing:.3px;color:#fff;background:var(--live2);padding:3px 7px;border-radius:6px;white-space:nowrap}
.livebadge.inline{position:static;align-self:flex-start}
.livebadge.big{left:14px;top:14px;font-size:12px;padding:5px 9px;border-radius:7px}
.playmini{position:absolute;right:8px;bottom:8px;width:30px;height:30px;border-radius:15px;background:rgba(19,37,74,.78);color:#fff;display:flex;align-items:center;justify-content:center}
.playmini.big{right:10px;bottom:10px;width:34px;height:34px;border-radius:17px}
.tile-name{font-weight:700;font-size:14.5px;line-height:1.25}
.tile-sub{font-size:12.5px;color:var(--muted)}
.laters{margin:0 20px}
.later{display:flex;align-items:center;gap:12px;min-height:52px;border-top:1px solid var(--line);color:var(--muted)}
.lt{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px;color:var(--ink)}
.lt b{font-weight:600;font-size:15px}
.lt span{font-size:12.5px;color:var(--muted)}
.lo{flex:none;font-size:13px;font-weight:700}
.mapbtn{position:absolute;left:50%;bottom:calc(26px + env(safe-area-inset-bottom));z-index:8;transform:translateX(-50%);display:flex;align-items:center;gap:8px;height:50px;padding:0 22px;border:0;border-radius:25px;background:var(--primary);color:var(--on-primary);box-shadow:0 8px 20px var(--shadow2);font-weight:700;font-size:15px;cursor:pointer}

/* ---- preview ---- */
.sheet-prev{position:relative}
.pv{display:flex;flex-direction:column;gap:14px;padding:10px 20px calc(24px + env(safe-area-inset-bottom))}
.pv-handle{align-self:center;width:40px;height:5px;border-radius:3px;background:var(--line2)}
.pv-top{display:flex;align-items:flex-start;gap:14px}
.thumb{flex:none;width:72px;height:72px;border-radius:14px;display:flex;align-items:center;justify-content:center}
.pv-txt{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:5px;padding-top:2px}
.pv-title{font-family:var(--head);font-weight:800;font-size:19px;line-height:1.2}
.pv-l1{font-size:14px;font-weight:600}
.pv-l2{font-size:13.5px;color:var(--muted)}
.pv-x{flex:none;width:44px;height:44px;margin:-6px -8px 0 0;padding:0;border:0;border-radius:22px;background:var(--surface3);color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer}
.pv-btns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 12px;border:1px solid var(--btnbd);border-radius:12px;background:var(--surface);color:var(--ink);font-weight:700;font-size:15px;text-decoration:none;cursor:pointer;white-space:nowrap}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.btn.wide{width:100%}
.btn.big{height:50px;font-size:16px}

/* ---- language and demo sheets ---- */
.lang-wrap{position:absolute;inset:0;z-index:20}
.lang-dim{position:absolute;inset:0;background:var(--dim)}
.lang-sheet{position:absolute;left:0;right:0;bottom:0;max-height:86%;overflow-y:auto;padding:12px 16px calc(20px + env(safe-area-inset-bottom));border-radius:22px 22px 0 0;background:var(--surface);color:var(--ink)}
.lang-head{display:flex;align-items:center;justify-content:space-between;padding:4px 4px 8px}
.lang-head h2{display:flex;align-items:center;gap:8px;font-family:var(--head);font-weight:800;font-size:19px}
.lang-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:12px}
.lang-opt{display:flex;align-items:center;gap:10px;height:50px;padding:0 12px;border:1px solid var(--chipbd);border-radius:12px;background:var(--surface);color:var(--ink);font-weight:600;font-size:15px;text-align:left;cursor:pointer}
.lang-opt span:nth-child(2){flex:1}
.lang-opt.on{border:2px solid var(--ink)}
.lang-sheet .small{padding:0 4px}
.demo-sheet{max-height:90%}
.demo-intro{padding:0 4px;margin:2px 0 10px}
.dtabs{margin:0 0 12px;grid-template-columns:repeat(2,minmax(0,1fr))}
.lgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:6px}
.lcard{display:flex;flex-direction:column;gap:4px;min-width:0;padding:0;border:0;background:transparent;text-align:left;color:var(--ink);cursor:pointer}
.limg{position:relative;display:block;height:220px;border-radius:16px;overflow:hidden;background:var(--app);box-shadow:0 0 0 1px var(--line2)}
.limg img{display:block;width:100%;height:100%;object-fit:cover;object-position:top}
.lbadge{position:absolute;left:8px;bottom:8px;font-size:11px;font-weight:700;color:#fff;background:#1F5BD8;padding:4px 8px;border-radius:7px}
.lname{margin-top:4px;font-family:var(--head);font-weight:800;font-size:14.5px}
.ldesc{font-size:12.5px;line-height:1.35;color:var(--muted)}
.appear{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 4px 12px;border-bottom:1px solid var(--line);margin-bottom:4px}
.appear>span{font-size:15.5px;font-weight:700}
.seg3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:3px;padding:3px;border-radius:12px;background:var(--surface3)}
.seg3 button{height:36px;padding:0 12px;border:0;border-radius:9px;background:transparent;color:var(--muted);font-weight:700;font-size:13.5px;cursor:pointer}
.seg3 button[aria-pressed="true"]{background:var(--tabsel);color:var(--ink);box-shadow:0 1px 3px var(--shadow)}
.flist{display:flex;flex-direction:column;margin-bottom:12px}
.frow{display:flex;align-items:center;gap:14px;min-height:64px;padding:8px 4px;border:0;border-top:1px solid var(--line);background:transparent;text-align:left;color:var(--ink);cursor:pointer}
.frow:first-child{border-top:0}
.ftxt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.ftxt b{font-size:15.5px;font-weight:700}
.ftxt span{font-size:12.5px;line-height:1.35;color:var(--muted)}
.sw{flex:none;position:relative;width:50px;height:30px;border-radius:15px;background:var(--sw-off);transition:background .2s}
.sw span{position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:12px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s var(--ease)}
.sw.on{background:#1E8E4E}
.sw.on span{transform:translateX(20px)}
.viewer-wrap{position:absolute;inset:0;z-index:40}
.viewer{position:absolute;inset:0;display:flex;flex-direction:column;background:rgba(8,12,20,.96);color:#fff}
.v-top{display:flex;align-items:center;justify-content:space-between;padding:max(10px,env(safe-area-inset-top)) 12px 0 20px}
.v-count{font-size:13px;font-weight:700;color:#C9D2E3}
.pv-x.dark{margin:0;background:rgba(255,255,255,.14);color:#fff}
.v-stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:10px 16px;touch-action:pan-y}
.viewer-img{display:block;max-width:100%;max-height:100%;border-radius:22px;box-shadow:0 20px 50px rgba(0,0,0,.45);user-select:none;-webkit-user-select:none}
.v-bottom{display:flex;align-items:center;gap:10px;padding:0 10px calc(18px + env(safe-area-inset-bottom))}
.v-nav{flex:none;width:48px;height:48px;padding:0;border:0;border-radius:24px;background:rgba(255,255,255,.14);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer}
.v-cap{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center}
.v-cap b{font-family:var(--head);font-weight:800;font-size:17px}
.v-cap span{font-size:13px;line-height:1.35;color:#C9D2E3}
.v-try{margin-top:8px;height:42px;border-color:#fff;background:#fff;color:#13254A}

/* ---- recommendations, visitor photos and points ---- */
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:16px 20px 0}
.sec-h h3{font-family:var(--head);font-weight:800;font-size:16px}
.thumb img,.phpin img,.pk-img img,.spc-img img,.boc-img img,.gt img,.cr-img img{display:block;width:100%;height:100%;object-fit:cover}
.thumb,.gt{overflow:hidden}
.gt img{position:absolute;inset:0}
.gt .playmini{position:relative}
.pklist{display:flex;flex-direction:column;gap:12px;padding:6px 16px 0}
.pk{position:relative;display:block;width:100%;height:172px;padding:0;border:0;border-radius:18px;overflow:hidden;text-align:left;color:#fff;cursor:pointer;-webkit-user-select:none;user-select:none}
.pk-img{position:absolute;inset:0}
.pk-shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.32) 0%,rgba(0,0,0,0) 30%,rgba(0,0,0,0) 44%,rgba(0,0,0,.76) 100%)}
.pk-top{position:absolute;left:10px;right:10px;top:10px;display:flex;align-items:center;gap:6px}
.pk-n{flex:none;min-width:30px;height:30px;padding:0 6px;border-radius:15px;border:2px solid #fff;background:#13254A;color:#fff;font-weight:800;font-size:13.5px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.28)}
.sp.onimg{background:#fff;color:#B8232F;align-self:center;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.pk-hot{margin-left:auto;display:inline-flex;align-items:center;gap:4px;height:27px;padding:0 10px 0 8px;border-radius:14px;background:#EB5A1E;color:#fff;font-size:12px;font-weight:800;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.22)}
.pk-bot{position:absolute;left:14px;right:12px;bottom:12px;display:flex;align-items:flex-end;gap:10px}
.pk-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.pk-txt b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-family:var(--head);font-weight:800;font-size:19.5px;line-height:1.15;text-shadow:0 1px 10px rgba(0,0,0,.45)}
.pk-txt span{font-size:13.5px;font-weight:600;color:rgba(255,255,255,.93);text-shadow:0 1px 6px rgba(0,0,0,.45)}
.pk-rec{flex:none;display:inline-flex;align-items:center;gap:5px;height:30px;padding:0 11px;border-radius:15px;background:rgba(255,255,255,.95);color:#13254A;font-size:13.5px;font-weight:800}
.pk-rec svg{color:#1F5BD8}
.spc{display:flex;align-items:center;gap:14px;width:calc(100% - 32px);margin:8px 16px 0;padding:10px 12px 10px 10px;border:1px solid var(--line2);border-radius:18px;background:var(--surface2);text-align:left;color:var(--ink);cursor:pointer}
.spc-img{flex:none;width:112px;height:88px;border-radius:13px;overflow:hidden}
.spc-txt{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:3px}
.spc-txt b{max-width:100%;font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bo{margin:18px 0 0}
.bo-h{display:flex;align-items:center;margin:0 20px 10px}
.bo-h h3{font-family:var(--head);font-weight:800;font-size:16px}
.bo-scroll{display:flex;gap:12px;padding:0 20px 2px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding:0 20px;scrollbar-width:none;overscroll-behavior-x:contain}
.bo-scroll::-webkit-scrollbar{display:none}
.bo-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 12px;padding:0 20px}
.boc{flex:none;width:158px;display:flex;flex-direction:column;align-items:flex-start;gap:3px;min-width:0;padding:0;border:0;background:transparent;text-align:left;color:var(--ink);cursor:pointer;scroll-snap-align:start}
.bo-grid .boc{width:auto}
.boc-img{position:relative;width:100%;aspect-ratio:4/3;margin-bottom:5px;border-radius:14px;overflow:hidden}
.boc-img .medal-s{position:absolute;left:8px;top:8px;width:30px;height:30px;border:2px solid #fff;font-size:13.5px}
.boc-name{font-weight:700;font-size:14.5px;line-height:1.25}
.boc .sp{margin:1px 0}
.credits{margin:14px 20px 0}
.cr{display:flex;align-items:center;gap:12px;min-height:72px;padding:8px 0;border-top:1px solid var(--line);color:var(--ink);text-decoration:none}
.cr:first-child{border-top:0}
.cr-img{flex:none;width:56px;height:56px;border-radius:12px;overflow:hidden}
.cr-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.cr-txt b{font-size:14.5px;font-weight:700}
.cr-txt span{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.cr svg{flex:none;color:var(--muted)}
.hero.photo .playbig,.hero.photo .hero-bar,.hero.photo .hero-label,.hero.photo .hero-dots{z-index:1}
.hero.photo .playbig{position:relative}
.note a{color:inherit;font-weight:700}
.soc{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;margin-top:1px}
.rec{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;color:var(--ink2)}
.rec svg{flex:none;color:var(--pick)}
.rec.big{font-size:15px}
.hot{display:inline-flex;align-items:center;gap:3px;height:21px;padding:0 8px 0 6px;border-radius:999px;background:var(--hot-bg);color:var(--hot-fg);font-size:11.5px;font-weight:800;white-space:nowrap}
.phgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 12px;padding:10px 20px 0}
.phcard{position:relative;min-width:0;display:flex;flex-direction:column;gap:6px}
.ph-open{display:flex;flex-direction:column;gap:6px;width:100%;min-width:0;padding:0;border:0;background:transparent;text-align:left;color:var(--ink);cursor:pointer}
.ph-img{position:relative;display:block;width:100%;aspect-ratio:4/5;border-radius:16px;overflow:hidden}
.ph-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph-cap{font-weight:700;font-size:14px;line-height:1.25}
.ph-sub{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;font-size:12.5px;line-height:1.3;color:var(--muted)}
.ph-like{position:absolute;right:8px;top:8px;display:flex;align-items:center;gap:5px;height:34px;padding:0 11px 0 9px;border:0;border-radius:17px;background:var(--glass);color:var(--on-glass);font-weight:800;font-size:12.5px;box-shadow:0 1px 4px var(--shadow);cursor:pointer}
.ph-like::after{content:"";position:absolute;inset:-6px}
.ph-like.mine{cursor:default;font-weight:700}
.ph-top{position:absolute;left:8px;bottom:8px;font-size:10.5px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;color:#fff;background:#D7263D;padding:4px 8px;border-radius:7px;pointer-events:none}
.phpin{position:absolute;padding:0;border-radius:11px;border:2.5px solid #fff;box-shadow:0 2px 8px var(--shadow2);display:block;overflow:hidden;cursor:pointer}
.phpin.on{border-radius:12px;box-shadow:0 0 0 3px var(--pick),0 4px 10px var(--shadow2)}
.medal-s{flex:none;width:32px;height:32px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;box-shadow:inset 0 -2px 0 rgba(0,0,0,.14)}
.m1{background:#E2A90F;color:#2A1F00}
.m2{background:#B7C0CC;color:#1C2430}
.m3{background:#B0683A;color:#fff}
.m4{background:var(--surface3);color:var(--muted)}
.pin.mpin.m1{background:#E2A90F;color:#2A1F00}
.pin.mpin.m2{background:#B7C0CC;color:#1C2430}
.pin.mpin.m3{background:#B0683A;color:#fff}
.pin.mpin.m4{background:var(--pin-plain);color:#fff}
.pin.spin,.pin.spin.on{background:var(--surface);color:var(--sp-fg);border-color:var(--sp-fg)}
.pin.mpin.on,.pin.spin.on{box-shadow:0 0 0 3px var(--pin-bd),0 0 0 7px var(--dot),0 4px 10px var(--shadow2)}
.earn{display:flex;flex-direction:column;gap:8px}
.earn-h{font-size:11.5px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--muted)}
.earn-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.earn-b{display:flex;flex-direction:column;align-items:stretch;justify-content:space-between;gap:6px;min-width:0;min-height:64px;padding:9px 10px 10px;border:1px solid var(--chipbd);border-radius:14px;background:var(--surface);color:var(--ink);text-align:left;cursor:pointer;transition:background .2s,opacity .2s}
.eb-top{display:flex;align-items:center;justify-content:space-between}
.eb-p{font-size:11.5px;font-weight:800;color:var(--pts-fg);background:var(--pts-bg);padding:2px 7px;border-radius:999px}
.eb-l{font-size:13px;font-weight:700;line-height:1.2}
.earn-b.locked{opacity:.5}
.earn-b.done{border-color:transparent;background:var(--done-bg);color:var(--done-fg);cursor:default}
.vis{display:flex;flex-direction:column;gap:12px}
.pad .vis{margin-top:24px}
.vis h2{font-family:var(--head);font-weight:800;font-size:17px}
.vis-stats{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.vgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 10px}
.vgrid .ph-img{aspect-ratio:1}
.vis .vis-note{font-size:12.5px;line-height:1.45;color:var(--muted)}
.rev .rec{align-self:flex-start}
.fair h2{display:flex;align-items:center;gap:8px}
.fair svg{color:var(--pick)}
.hero-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tbtn{width:100%;min-height:52px;padding:0;border:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:transparent;color:var(--ink);text-align:left;cursor:pointer}
.tbtn h3{flex:1;min-width:0}
.tcount{flex:none;font-size:13px;font-weight:600;color:var(--muted)}
.dtc.wpts{height:44px;padding:0 7px 0 11px}
.dtc-t{display:flex;flex-direction:column;align-items:flex-start;gap:2px;line-height:1.1}
.dtc-p{font-size:11px;font-weight:800;letter-spacing:.3px;color:#FFD36B}
