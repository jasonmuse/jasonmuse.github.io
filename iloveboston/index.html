<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>I Love Boston · Downtown Crossing</title>
<meta name="description" content="Everything near the Downtown Crossing sign: places, what's on, live pop-ups and the T. A clickable demo.">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#E9EDF2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="I Love Boston">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Montserrat:wght@700;800&display=swap">
<style>
:root{--navy:#13254A;--red:#B8232F;--live:#D7263D;--live2:#C41E35;--pick:#1F5BD8;--muted:#5B6475;--line:#EDEFF3;--chip:#DDE1E8;--map:#E9EDF2;--soft:#F4F5F8;--seg:#F1F3F7;--green:#1E6A45;
  --font:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--head:Montserrat,Inter,system-ui,sans-serif;--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:#DCE1E8}
body{font-family:var(--font);color:var(--navy);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;-webkit-appearance:none;appearance:none}
a{color:var(--navy)}
h1,h2,h3,p{margin:0}
#safe{position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
#app{position:relative;width:100%;max-width:430px;height:100vh;height:100dvh;margin:0 auto;overflow:hidden;background:var(--map)}
@media (min-width:600px) and (min-height:720px){body{display:flex;align-items:center;justify-content:center}#app{height:min(860px,calc(100dvh - 48px));border-radius:34px;box-shadow:0 30px 80px rgba(11,22,48,.35)}}
#app.instant *{transition:none!important}
.scr{position:absolute;inset:0;overflow:hidden}
.muted{color:var(--muted)}
.small{font-size:12px;line-height:1.45}
.center{text-align:center}
.pb{padding-bottom:110px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);margin:26px 20px 2px}
.eyebrow.light{color:#C9D2E3;margin:0;font-size:12px;letter-spacing:.8px}
@keyframes ilbPulse{0%{box-shadow:0 0 0 0 rgba(215,38,61,.5),0 2px 6px rgba(19,37,74,.3)}70%{box-shadow:0 0 0 14px rgba(215,38,61,0),0 2px 6px rgba(19,37,74,.3)}100%{box-shadow:0 0 0 0 rgba(215,38,61,0),0 2px 6px rgba(19,37,74,.3)}}
@keyframes ilbDot{0%{box-shadow:0 0 0 0 rgba(215,38,61,.45)}70%{box-shadow:0 0 0 7px rgba(215,38,61,0)}100%{box-shadow:0 0 0 0 rgba(215,38,61,0)}}
.pulse{animation:ilbPulse 2.2s ease-out infinite}
.pdot{animation:ilbDot 2s ease-out infinite}
@media (prefers-reduced-motion:reduce){.pulse,.pdot{animation:none}.world,.sheet,.recenter{transition:none!important}}

/* ---- map ---- */
.map{position:absolute;inset:0;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
.map.grabbing{cursor:grabbing}
.world{position:absolute;left:0;top:0;width:0;height:0;will-change:transform;transition:transform .45s var(--ease)}
.world.nodrag{transition:none}
.wsvg{position:absolute;left:-260px;top:-300px;display:block;pointer-events:none}
.chip-st{position:absolute;display:flex;align-items:center;gap:3px;padding:3px 6px 3px 4px;border-radius:999px;background:#fff;box-shadow:0 1px 4px rgba(19,37,74,.25);font-size:10.5px;font-weight:700;white-space:nowrap;pointer-events:none}
.dot8{width:8px;height:8px;border-radius:4px}
.pin{position:absolute;padding:0;border-radius:50%;border:2px solid #fff;background:var(--navy);color:#fff;font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(19,37,74,.3);cursor:pointer}
.pin.on{background:var(--pick);font-size:14px;box-shadow:0 0 0 5px rgba(31,91,216,.25),0 4px 10px rgba(19,37,74,.35)}
.flagpin{position:absolute;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;padding:0;border:0;background:transparent;filter:drop-shadow(0 2px 3px rgba(19,37,74,.35));cursor:pointer}
.fp{display:flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:12px;color:#fff;font-weight:700;font-size:11.5px;white-space:nowrap}
.fpdot{flex:none;width:7px;height:7px;border-radius:4px;background:#FF5A6E}
.tail{width:0;height:0;margin-top:-1px;border-left:6px solid transparent;border-right:6px solid transparent;border-top:7px solid var(--navy)}
.livepin{position:absolute;padding:0;border-radius:50%;border:3px solid #fff;background:var(--live);box-shadow:0 2px 6px rgba(19,37,74,.3);cursor:pointer}
.livepin.on{box-shadow:0 0 0 5px rgba(31,91,216,.3),0 4px 10px rgba(19,37,74,.35)}
.spot{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;gap:4px;height:24px;padding:0 8px 0 7px;border-radius:12px;border:1.5px solid var(--red);background:#fff;box-shadow:0 1px 4px rgba(19,37,74,.25);color:var(--navy);text-decoration:none;font-size:10.5px;font-weight:800;letter-spacing:.5px;white-space:nowrap}

/* ---- top bar ---- */
.topbar{position:absolute;left:0;right:0;top:0;z-index:5;display:flex;justify-content:space-between;padding:max(12px,env(safe-area-inset-top)) 12px 0;pointer-events:none}
.pillw{pointer-events:auto;display:flex;align-items:center;height:44px;border-radius:22px;background:#fff;box-shadow:0 4px 14px rgba(19,37,74,.14)}
.logo{gap:5px;padding:0 16px;font-family:var(--head);font-weight:800;font-size:16px;letter-spacing:.4px}
.langbtn{gap:8px;padding:0 14px;border:0;font-weight:700;font-size:13px;cursor:pointer}
.flag{flex:none;display:block;width:21px;height:14px;border-radius:3px;overflow:hidden;box-shadow:0 0 0 1px rgba(19,37,74,.14)}
.flag svg{display:block;width:100%;height:100%}
.recenter{position:absolute;right:12px;z-index:6;width:44px;height:44px;padding:0;border:0;border-radius:22px;background:#fff;color:var(--pick);box-shadow:0 4px 14px rgba(19,37,74,.2);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:top .35s var(--ease)}

/* ---- the sheet ---- */
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:7;overflow:hidden;background:#fff;border-radius:24px 24px 0 0;box-shadow:0 -10px 30px rgba(19,37,74,.18);transition:top .35s var(--ease)}
.sheet.nodrag{transition:none}
.sheet-list{position:absolute;inset:0;display:flex;flex-direction:column}
.sh-head{flex:none;position:relative;display:flex;align-items:center;gap:12px;padding:18px 16px 12px 20px;background:var(--navy);color:#fff;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
.handle{position:absolute;left:50%;top:7px;width:36px;height:4px;margin-left:-18px;border-radius:2px;background:rgba(255,255,255,.35)}
.sh-title{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px;padding:2px 0;border:0;background:transparent;color:#fff;text-align:left;cursor:pointer}
.cap{font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:#C9D2E3}
.ttl{font-family:var(--head);font-weight:800;font-size:20px;white-space:nowrap}
.dtc{flex:none;display:flex;align-items:center;gap:5px;height:40px;padding:0 8px 0 11px;border:1px solid rgba(255,255,255,.4);border-radius:10px;color:#fff!important;text-decoration:none;font-size:12px;font-weight:700;letter-spacing:1px}
.tabs{flex:none;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;margin:12px 16px 4px;padding:4px;border-radius:14px;background:var(--seg)}
.tab{display:flex;align-items:center;justify-content:center;gap:7px;min-width:0;height:40px;padding:0 4px;border:0;border-radius:10px;background:transparent;color:var(--muted);font-weight:700;font-size:13.5px;white-space:nowrap;overflow:hidden;cursor:pointer}
.tab span:last-child{overflow:hidden;text-overflow:ellipsis}
.tab[aria-selected="true"]{background:#fff;color:var(--navy);box-shadow:0 1px 3px rgba(19,37,74,.16)}
.ldot{flex:none;display:inline-block;width:8px;height:8px;border-radius:4px;background:var(--live)}
.sh-body{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.chips{display:flex;gap:6px;padding:2px 16px 0;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:44px;padding:0;border:0;background:transparent;cursor:pointer}
.chip span{display:flex;align-items:center;height:34px;padding:0 14px;border-radius:999px;border:1px solid var(--chip);background:#fff;color:var(--navy);font-weight:600;font-size:13.5px;white-space:nowrap}
.chip[aria-pressed="true"] span{background:var(--navy);border-color:var(--navy);color:#fff}
.line{position:relative;margin:4px 20px 0}
.rail{position:absolute;top:31px;bottom:31px;width:3px;border-radius:2px;background:var(--navy)}
.mark{position:relative;display:flex;align-items:center;height:30px}
.mark::before{content:"";position:absolute;left:0;right:0;top:14px;border-top:1.5px dashed #AEB6C4}
.mark span{position:relative;margin-left:var(--ml,84px);padding:0 8px;background:#fff;font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--muted)}
.row{position:relative;display:flex;align-items:center;width:100%;min-height:62px;padding:0;border:0;background:transparent;text-align:left;color:var(--navy);cursor:pointer}
.row .tcol{flex:none;width:48px;text-align:right;font-size:13px;font-weight:800}
.row .lcol{flex:none;width:32px;display:flex;justify-content:center}
.stop{width:24px;height:24px;border-radius:12px;border:2.5px solid var(--navy);background:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800}
.row .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;padding:8px 0 8px 6px}
.nm{display:flex;align-items:center;gap:6px;min-width:0}
.nm b{font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp{flex:none;align-self:flex-start;font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--red);background:#FBE8EA;padding:2px 6px;border-radius:5px}
.nm .sp{align-self:center}
.sp.big{font-size:11px;letter-spacing:.6px;padding:5px 9px;border-radius:6px}
.sub{font-size:13px;color:var(--muted)}
.row.ev{min-height:64px}
.row.ev .tcol{width:58px;display:flex;flex-direction:column;align-items:flex-end;gap:1px}
.wd{font-size:10.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--muted)}
.tm{font-size:13px;font-weight:800}
.tilll{font-size:10.5px;font-weight:600;color:var(--muted);white-space:nowrap}
.estop{width:14px;height:14px;border-radius:7px;border:2.5px solid var(--navy);background:#fff}
.estop.now{border-color:var(--live);background:var(--live)}
.evprice{font-weight:700}
.evprice.free{color:var(--green)}
.note{margin:12px 20px 0;font-size:13px;color:var(--muted)}
.note.small{font-size:12px}
.tsec{margin:28px 20px 0}
.tsec-h{display:flex;align-items:center;gap:8px}
.tsec-h h3{font-family:var(--head);font-weight:800;font-size:16px}
.tlist{margin:6px 0 4px}
.st{border-top:1px solid var(--line)}
.st-row{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;padding:0;border:0;background:transparent;text-align:left;cursor:pointer}
.st-name{flex:1;min-width:0;font-weight:600;font-size:15px}
.st-lines{display:flex;gap:4px}
.lp{font-size:11px;font-weight:700;padding:2px 7px;border-radius:5px}
.st-walk{flex:none;width:44px;text-align:right;font-size:13px;font-weight:700}
.chev{flex:none;display:flex;color:var(--muted);transition:transform .2s}
.chev.open{transform:rotate(90deg)}
.trains{margin:0 0 12px;padding:2px 12px;border-radius:14px;background:var(--soft)}
.tr{display:flex;align-items:center;gap:10px;min-height:48px;border-top:1px solid #E3E6EC}
.tr:first-child{border-top:0}
.tbar{flex:none;width:4px;height:28px;border-radius:2px}
.tto{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.tl{font-size:10.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--muted)}
.td{font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t1{flex:none;font-size:14px;font-weight:800}
.t2{flex:none;width:44px;text-align:right;font-size:13px;font-weight:600;color:var(--muted)}
.cta-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:24px 20px 0;min-height:52px;padding:0 16px;border-radius:14px;background:var(--soft);color:var(--navy);text-decoration:none;font-weight:700;font-size:14px}
.livecount{display:flex;align-items:center;gap:9px;padding:8px 20px 0;font-size:14px;font-weight:600}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 12px;padding:14px 20px 0}
.tile{display:flex;flex-direction:column;gap:8px;min-width:0;padding:0;border:0;background:transparent;text-align:left;cursor:pointer}
.tile-media{position:relative;display:flex;align-items:center;justify-content:center;width:100%;height:150px;border-radius:16px}
.livebadge{position:absolute;left:8px;top:8px;font-size:10px;font-weight:700;letter-spacing:.3px;color:#fff;background:var(--live2);padding:3px 7px;border-radius:6px;white-space:nowrap}
.livebadge.inline{position:static;align-self:flex-start}
.livebadge.big{left:14px;top:14px;font-size:12px;padding:5px 9px;border-radius:7px}
.playmini{position:absolute;right:8px;bottom:8px;width:30px;height:30px;border-radius:15px;background:rgba(19,37,74,.78);color:#fff;display:flex;align-items:center;justify-content:center}
.playmini.big{right:10px;bottom:10px;width:34px;height:34px;border-radius:17px}
.tile-name{font-weight:700;font-size:14.5px;line-height:1.25}
.tile-sub{font-size:12.5px;color:var(--muted)}
.laters{margin:0 20px}
.later{display:flex;align-items:center;gap:12px;min-height:52px;border-top:1px solid var(--line);color:var(--muted)}
.lt{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px;color:var(--navy)}
.lt b{font-weight:600;font-size:15px}
.lt span{font-size:12.5px;color:var(--muted)}
.lo{flex:none;font-size:13px;font-weight:700}
.mapbtn{position:absolute;left:50%;bottom:calc(26px + env(safe-area-inset-bottom));z-index:8;transform:translateX(-50%);display:flex;align-items:center;gap:8px;height:50px;padding:0 22px;border:0;border-radius:25px;background:var(--navy);color:#fff;box-shadow:0 8px 20px rgba(19,37,74,.3);font-weight:700;font-size:15px;cursor:pointer}

/* ---- preview ---- */
.sheet-prev{position:relative}
.pv{display:flex;flex-direction:column;gap:14px;padding:10px 20px calc(24px + env(safe-area-inset-bottom))}
.pv-handle{align-self:center;width:40px;height:5px;border-radius:3px;background:#D6DBE3}
.pv-top{display:flex;align-items:flex-start;gap:14px}
.thumb{flex:none;width:72px;height:72px;border-radius:14px;display:flex;align-items:center;justify-content:center}
.pv-txt{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:5px;padding-top:2px}
.pv-title{font-family:var(--head);font-weight:800;font-size:19px;line-height:1.2}
.pv-l1{font-size:14px;font-weight:600}
.pv-l2{font-size:13.5px;color:var(--muted)}
.pv-x{flex:none;width:44px;height:44px;margin:-6px -8px 0 0;padding:0;border:0;border-radius:22px;background:var(--seg);color:var(--navy);display:flex;align-items:center;justify-content:center;cursor:pointer}
.pv-btns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 12px;border:1px solid var(--navy);border-radius:12px;background:#fff;color:var(--navy);font-weight:700;font-size:15px;text-decoration:none;cursor:pointer;white-space:nowrap}
.btn.primary{background:var(--navy);color:#fff}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.btn.wide{width:100%}
.btn.big{height:50px;font-size:16px}

/* ---- language sheet ---- */
.lang-wrap{position:absolute;inset:0;z-index:20}
.lang-dim{position:absolute;inset:0;background:rgba(11,22,48,.45)}
.lang-sheet{position:absolute;left:0;right:0;bottom:0;max-height:86%;overflow-y:auto;padding:12px 16px calc(20px + env(safe-area-inset-bottom));border-radius:22px 22px 0 0;background:#fff}
.lang-head{display:flex;align-items:center;justify-content:space-between;padding:4px 4px 8px}
.lang-head h2{display:flex;align-items:center;gap:8px;font-family:var(--head);font-weight:800;font-size:19px}
.lang-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:12px}
.lang-opt{display:flex;align-items:center;gap:10px;height:50px;padding:0 12px;border:1px solid var(--chip);border-radius:12px;background:#fff;font-weight:600;font-size:15px;text-align:left;cursor:pointer}
.lang-opt span:nth-child(2){flex:1}
.lang-opt.on{border:2px solid var(--navy)}
.lang-sheet .small{padding:0 4px}

/* ---- toast ---- */
.toast{position:absolute;left:50%;bottom:calc(30px + env(safe-area-inset-bottom));z-index:30;transform:translateX(-50%);max-width:86%;padding:11px 16px;border-radius:14px;background:rgba(11,22,48,.92);color:#fff;font-size:14px;font-weight:600;text-align:center;box-shadow:0 8px 20px rgba(11,22,48,.3)}

/* ---- other screens ---- */
.page{background:var(--soft)}
.page.white{background:#fff}
.scroll{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.round{width:44px;height:44px;padding:0;border:0;border-radius:22px;background:rgba(255,255,255,.92);color:var(--navy);display:flex;align-items:center;justify-content:center;cursor:pointer}
.bar{display:flex;align-items:center;justify-content:space-between;padding:max(8px,env(safe-area-inset-top)) 12px 0 6px}
.bar .round{background:transparent}
.bar.white{background:#fff;padding-bottom:8px}
.logo-s{display:flex;align-items:center;gap:5px;font-family:var(--head);font-weight:800;font-size:15px;letter-spacing:.4px}
.biztag{font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;padding:6px 9px;border:1px solid var(--chip);border-radius:8px}
.pad{padding:0 20px}
.pad.tight{padding:6px 20px 0}
.pad.tight p{margin-top:6px;font-size:14px;line-height:1.45}
.h1{font-family:var(--head);font-weight:800;font-size:27px}
.h2{font-family:var(--head);font-weight:800;font-size:20px}
.hero{position:relative;height:330px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.hero.small{height:190px;cursor:default}
.hero-bar{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;padding:max(12px,env(safe-area-inset-top)) 12px 0}
.hero-label{position:absolute;left:14px;bottom:32px;font-size:12px;font-weight:600;color:var(--navy);background:rgba(255,255,255,.9);padding:4px 9px;border-radius:7px}
.hero.small .hero-label{bottom:14px}
.hero-dots{position:absolute;right:8px;bottom:22px;display:flex}
.hero-dots button{width:30px;height:44px;padding:0;border:0;background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer}
.hero-dots span{height:7px;border-radius:4px;transition:width .2s}
.playbig{width:68px;height:68px;border-radius:34px;background:rgba(19,37,74,.8);color:#fff;display:flex;align-items:center;justify-content:center}
.sheet-card{position:relative;margin-top:-18px;border-radius:22px 22px 0 0;background:var(--soft);padding:18px 20px 0;display:flex;flex-direction:column;gap:14px}
.badges{display:flex;flex-wrap:wrap;gap:6px}
.fav{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;border:1px solid #C9D0DD;padding:4px 9px;border-radius:6px;color:var(--navy)}
.fav svg{color:#C98A0B;fill:#C98A0B}
.title-block{display:flex;flex-direction:column;gap:4px}
.title-block h1{font-family:var(--head);font-weight:800;font-size:27px;line-height:1.15}
.tagline{font-size:15px;color:#3D4759}
.meta{font-size:13px;color:var(--muted)}
.acts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
