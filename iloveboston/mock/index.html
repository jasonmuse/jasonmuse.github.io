<!doctype html>
<html lang="en" data-theme="apple">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>I Love Boston mockups</title>
<!-- Nov 19 mockups. Open as ?s=a|b|c|p&t=apple|night|light (a 390x844 phone screen). How to remake: README.md. Map data © OpenStreetMap contributors (OpenMapTiles schema, OpenFreeMap tiles). Icons adapted from Lucide (ISC). -->
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:390px;height:844px;overflow:hidden}
body{font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;background:var(--m-land);color:var(--text);letter-spacing:-.011em;position:relative}

/* ---------- themes ---------- */
html[data-theme=apple]{
  --m-land:#35445A;--m-bld:#4A5170;--m-bld-side:#2D3548;--m-bld-line:#3A4560;--m-park:#2E5146;--m-wood:#2C4B41;--m-water:#25386E;
  --m-case:#2A3445;--m-minor:#68778C;--m-major:#828DA1;--m-hw:#A0A7B5;--m-svc:#505D72;--m-ped:#5F6C82;--m-path:#5B6A80;
  --m-lbl:#E2E8F6;--m-halo:#2A3344;--m-hood:#B9C3D7;--m-water-lbl:#8EA6E8;
  --glass:rgba(70,92,122,.56);--glass-hi:rgba(255,255,255,.18);--glass-bd:rgba(255,255,255,.17);--field:rgba(255,255,255,.13);
  --text:#fff;--sub:rgba(228,236,255,.68);--line:rgba(255,255,255,.12);--card:rgba(255,255,255,.09);--chip:rgba(255,255,255,.13);--chip-on:#fff;--chip-on-fg:#16202E;
  --shadow:0 12px 40px rgba(8,14,28,.42);--sb:#fff;
  --c-eat:#F49046;--c-eat-l:#FFB880;--c-drinks:#B77BFF;--c-drinks-l:#DCBFFF;--c-shop:#EDB534;--c-shop-l:#FFD873;--c-see:#EE72A8;--c-see-l:#FFA3CB;
  --c-park:#56C47A;--c-park-l:#9BE3AF;--c-svc:#7E9DCF;--c-svc-l:#BCD0F0;--c-live:#FF5A4E;--c-live-l:#FF9A91;
  --glyph:rgba(10,14,24,.72);--pin-ring:rgba(18,24,36,.5);--poi-halo:rgba(34,42,58,.92);
  --t-bg:#3C4658;--t-fg:#fff;--t-bd:#C9D1E0;--open:#5BE37D;--soon:#FFB547;--blue:#3D9DFF;
  --ph-ring:#E8EEFA;--sheet-tint:radial-gradient(120% 70% at 12% 0%,rgba(120,190,200,.16),transparent 60%),radial-gradient(90% 60% at 100% 30%,rgba(120,150,255,.12),transparent 60%);
}
html[data-theme=night]{
  --m-land:#161B23;--m-bld:#21272F;--m-bld-side:#11151B;--m-bld-line:#1A1F27;--m-park:#163126;--m-wood:#152D24;--m-water:#0E2340;
  --m-case:#0F1318;--m-minor:#323B48;--m-major:#434E5E;--m-hw:#5B6676;--m-svc:#272F3A;--m-ped:#2D3642;--m-path:#2E3845;
  --m-lbl:#C7D0DC;--m-halo:#11151B;--m-hood:#8792A3;--m-water-lbl:#5F86C6;
  --glass:rgba(22,26,33,.80);--glass-hi:rgba(255,255,255,.07);--glass-bd:rgba(255,255,255,.09);--field:rgba(255,255,255,.08);
  --text:#F4F6F9;--sub:#99A3B0;--line:rgba(255,255,255,.08);--card:rgba(255,255,255,.06);--chip:rgba(255,255,255,.09);--chip-on:#F4F6F9;--chip-on-fg:#111;
  --shadow:0 12px 40px rgba(0,0,0,.6);--sb:#fff;
  --c-eat:#FF9447;--c-eat-l:#FFB27A;--c-drinks:#BF86FF;--c-drinks-l:#D7B7FF;--c-shop:#F5C142;--c-shop-l:#FFD97A;--c-see:#FF7AB4;--c-see-l:#FFA2CB;
  --c-park:#4FD07A;--c-park-l:#8EE3A6;--c-svc:#7FA4E0;--c-svc-l:#B6CBF0;--c-live:#FF5A4E;--c-live-l:#FF8F86;
  --glyph:rgba(0,0,0,.74);--pin-ring:rgba(0,0,0,.55);--poi-halo:rgba(14,17,22,.95);
  --t-bg:#262D38;--t-fg:#fff;--t-bd:#8D97A6;--open:#4ADE80;--soon:#FBBF24;--blue:#3B9BFF;
  --ph-ring:#D9DEE6;--sheet-tint:none;
}
html[data-theme=light]{
  --m-land:#F3F1EC;--m-bld:#E7E3DB;--m-bld-side:#D6D0C4;--m-bld-line:#DAD4C9;--m-park:#C8E6BA;--m-wood:#BCDDAB;--m-water:#A4CEF0;
  --m-case:#D8D2C6;--m-minor:#FFFFFF;--m-major:#FFFFFF;--m-hw:#FFD978;--m-svc:#FBFAF7;--m-ped:#F7F3EA;--m-path:#C9C1B2;
  --m-lbl:#55606E;--m-halo:#FFFFFF;--m-hood:#7D8796;--m-water-lbl:#4F86C2;
  --glass:rgba(250,250,252,.78);--glass-hi:rgba(255,255,255,.7);--glass-bd:rgba(0,0,0,.06);--field:rgba(118,118,128,.12);
  --text:#14171C;--sub:#69717D;--line:rgba(0,0,0,.08);--card:rgba(0,0,0,.035);--chip:rgba(118,118,128,.12);--chip-on:#14171C;--chip-on-fg:#fff;
  --shadow:0 12px 36px rgba(30,40,60,.18);--sb:#000;
  --c-eat:#F27B26;--c-eat-l:#C2570C;--c-drinks:#A35CF0;--c-drinks-l:#7E3BC9;--c-shop:#E7A912;--c-shop-l:#A16E00;--c-see:#E3528F;--c-see-l:#C2306F;
  --c-park:#3DAE5E;--c-park-l:#257A3E;--c-svc:#5C80BD;--c-svc-l:#3A5C99;--c-live:#F0443A;--c-live-l:#C8231A;
  --glyph:#fff;--pin-ring:#fff;--poi-halo:rgba(255,255,255,.95);
  --t-bg:#fff;--t-fg:#2A3240;--t-bd:#9AA3B1;--open:#1F9D4C;--soon:#C77700;--blue:#0A7CFF;
  --ph-ring:#fff;--sheet-tint:none;
}

/* ---------- map ---------- */
.mapbox{position:absolute;overflow:hidden;background:var(--m-land)}
.mapsvg{position:absolute;left:0;top:0;transform-origin:0 0}
.rmap .m-land{fill:var(--m-land)}
.rmap .m-park,.rmap .m-park2{fill:var(--m-park)}
.rmap .m-wood{fill:var(--m-wood)}
.rmap .m-water{fill:var(--m-water)}
.rmap .m-paths{stroke:var(--m-path);stroke-dasharray:2 3}
.rmap .m-bld-side{fill:var(--m-bld-side)}
.rmap .m-bld{fill:var(--m-bld);stroke:var(--m-bld-line);stroke-width:.7px}
.rmap .m-svc{stroke:var(--m-svc)}
.rmap .m-case{stroke:var(--m-case)}
.rmap .m-ped{stroke:var(--m-ped)}
.rmap .m-minor{stroke:var(--m-minor)}
.rmap .m-major{stroke:var(--m-major)}
.rmap .m-hw{stroke:var(--m-hw)}
.rmap text{font-family:Inter,sans-serif;paint-order:stroke;stroke:var(--m-halo);stroke-width:3px;stroke-linejoin:round}
.rmap .m-street-lbl{fill:var(--m-lbl);opacity:.82}
.rmap .m-hood-lbl{fill:var(--m-hood);font-size:12.5px;letter-spacing:2.4px;font-weight:800}
.rmap .m-water-lbl{fill:var(--m-water-lbl)}
.pins{position:absolute;inset:0}
.attr{position:absolute;right:12px;font-size:9.5px;font-weight:600;color:var(--m-lbl);opacity:.8;-webkit-text-stroke:2.5px var(--poi-halo);paint-order:stroke fill;z-index:3;white-space:nowrap}
.route{position:absolute;left:0;top:0;overflow:visible}

/* pins */
.poi{position:absolute;width:28px;height:28px;margin:-14px 0 0 -14px}
.poi .pg{position:absolute;inset:0;border-radius:50%;background:var(--c);color:var(--glyph);display:grid;place-items:center;box-shadow:0 0 0 2px var(--pin-ring),0 3px 8px rgba(0,0,0,.35)}
.poi.big{width:34px;height:34px;margin:-17px 0 0 -17px}
.poi .pl{position:absolute;top:50%;transform:translateY(-50%);left:calc(100% + 6px);white-space:nowrap;font-weight:700;font-size:13.5px;line-height:1.12;color:var(--cl);-webkit-text-stroke:3.2px var(--poi-halo);paint-order:stroke fill}
.poi.l .pl{left:auto;right:calc(100% + 6px);text-align:right}
.poi.b .pl{left:50%;top:calc(100% + 4px);transform:translateX(-50%);text-align:center}
.poi.t .pl{left:50%;top:auto;bottom:calc(100% + 4px);transform:translateX(-50%);text-align:center}
.poi .pl small{display:block;font-size:11.5px;font-weight:700;color:var(--m-lbl)}
.poi.dim{opacity:.38}
.poi.live .pg{background:var(--c-live)}
.poi.live .pg::after{content:'';position:absolute;inset:-6px;border-radius:50%;border:2px solid var(--c-live);opacity:.5}
.pbub{position:absolute;width:50px;height:50px;margin:-25px 0 0 -25px}
.pbub .pimg{position:absolute;inset:0;border-radius:50%;overflow:hidden;box-shadow:0 0 0 2.5px var(--ph-ring),0 4px 12px rgba(0,0,0,.45);background:#555}
.pbub .pimg img{width:100%;height:100%;object-fit:cover}
.pbub .pbl{position:absolute;left:50%;top:calc(100% + 5px);transform:translateX(-50%);width:130px;text-align:center;font-weight:800;font-size:11.5px;line-height:1.08;letter-spacing:.02em;text-transform:uppercase;color:var(--m-lbl);-webkit-text-stroke:3px var(--poi-halo);paint-order:stroke fill}
.pbub.sm{width:40px;height:40px;margin:-20px 0 0 -20px}
.you{position:absolute;width:0;height:0}
.you::before{content:'';position:absolute;left:-38px;top:-38px;width:76px;height:76px;border-radius:50%;background:rgba(40,140,255,.2);border:1px solid rgba(80,160,255,.35)}
.you i{position:absolute;left:-11px;top:-11px;width:22px;height:22px;border-radius:50%;background:#0A84FF;box-shadow:0 0 0 3.5px #fff,0 2px 10px rgba(0,0,0,.45)}
.you .yl{position:absolute;bottom:22px;left:50%;transform:translateX(-24%);white-space:nowrap;padding:5px 10px 5px 8px;border-radius:13px;font-size:12.5px;font-weight:700;display:flex;align-items:center;gap:5px;color:var(--text)}
.tst{position:absolute;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;background:var(--t-bg);color:var(--t-fg);border:2px solid var(--t-bd);display:grid;place-items:center;font-weight:900;font-size:12.5px;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.tst .tl{position:absolute;left:calc(100% + 5px);top:50%;transform:translateY(-50%);white-space:nowrap;font-weight:700;font-size:12.5px;color:var(--m-lbl);-webkit-text-stroke:3px var(--poi-halo);paint-order:stroke fill}
.tst.l .tl{left:auto;right:calc(100% + 5px)}
.num{position:absolute;width:22px;height:22px;margin:-11px 0 0 -11px;font-size:12px!important;border-radius:50%;background:var(--c-drinks);color:#fff;font-weight:800;font-size:13.5px;display:grid;place-items:center;box-shadow:0 0 0 2.5px #fff,0 3px 8px rgba(0,0,0,.4)}
.num .pl{position:absolute;left:calc(100% + 6px);top:50%;transform:translateY(-50%);white-space:nowrap;font-weight:700;font-size:12.5px;color:var(--c-drinks-l);-webkit-text-stroke:3px var(--poi-halo);paint-order:stroke fill}
.num.l .pl{left:auto;right:calc(100% + 6px)}
.walkchip{position:absolute;transform:translate(-50%,-50%);padding:3px 7px;border-radius:10px;font-size:11.5px;font-weight:800;background:var(--blue);color:#fff;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.3);display:flex;align-items:center;gap:3px}
.hl.la{transform:translate(0,-50%);text-align:left;line-height:1.1}
.hl{position:absolute;white-space:nowrap;font-weight:700;font-size:13px;color:var(--c-park-l);-webkit-text-stroke:3px var(--poi-halo);paint-order:stroke fill;transform:translate(-50%,-50%)}

/* ---------- chrome ---------- */
.sb{position:absolute;top:0;left:0;right:0;height:52px;z-index:60;display:flex;justify-content:space-between;align-items:center;padding:4px 30px 0 52px;font-weight:700;font-size:17px;color:var(--sb)}
.sb .ico{display:flex;gap:6px;align-items:center}
.island{position:absolute;top:11px;left:50%;width:124px;height:36px;margin-left:-62px;background:#000;border-radius:20px;z-index:61}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(26px) saturate(1.8);backdrop-filter:blur(26px) saturate(1.8);border:1px solid var(--glass-bd);box-shadow:var(--shadow)}
.topfade{position:absolute;left:0;right:0;top:0;height:120px;background:linear-gradient(var(--m-land),transparent);opacity:.55;z-index:5;pointer-events:none}
.brand{position:absolute;left:12px;top:56px;height:42px;border-radius:21px;display:flex;align-items:center;z-index:40;padding:0 6px 0 14px}
.brand .bn{display:flex;align-items:center;gap:5px;font-weight:900;font-size:15px;letter-spacing:.07em}
.brand .lang{display:flex;align-items:center;gap:5px;margin-left:12px;padding:0 10px;height:30px;border-radius:15px;background:var(--field);font-weight:800;font-size:13px}
.wx{position:absolute;right:12px;top:56px;height:42px;padding:0 12px;border-radius:21px;display:flex;align-items:center;gap:6px;font-weight:800;font-size:15px;z-index:40}
.wx small{font-weight:600;font-size:12px;color:var(--sub)}

/* ---------- sheet ---------- */
.sheet{position:absolute;left:8px;right:8px;bottom:8px;border-radius:36px;z-index:30;overflow:hidden}
.sheet::before{content:'';position:absolute;inset:0;background:var(--sheet-tint);pointer-events:none}
.sheet>.in{position:relative;padding:8px 16px 16px}
.grab{width:38px;height:5px;border-radius:3px;background:var(--sub);opacity:.6;margin:0 auto 12px}
.srow{display:flex;gap:10px;align-items:center}
.field{flex:1;height:50px;border-radius:25px;background:var(--field);display:flex;align-items:center;gap:10px;padding:0 16px;font-size:18px;color:var(--sub);font-weight:500}
.field b{color:var(--text);font-weight:600}
.avatar{width:50px;height:50px;border-radius:50%;flex:none;display:grid;place-items:center;background:linear-gradient(140deg,#8C9BB5,#5E6D88);color:#fff;box-shadow:0 0 0 2px var(--glass-bd)}
html[data-theme=light] .avatar{background:linear-gradient(140deg,#C9D2E0,#A3AFC2)}
.cats{display:flex;justify-content:space-between;margin-top:16px}
.cat{width:64px;display:flex;flex-direction:column;align-items:center;text-align:center}
.cat .cc{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;color:#fff;background:linear-gradient(160deg,var(--c1),var(--c2));box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 4px 12px rgba(0,0,0,.18);position:relative}
.cat b{font-size:14px;font-weight:700;margin-top:7px}
.cat small{font-size:12px;color:var(--sub);font-weight:500;margin-top:1px}
.cat .dot{position:absolute;top:3px;right:3px;width:13px;height:13px;border-radius:50%;background:#fff;box-shadow:0 0 0 3px rgba(255,80,70,.5)}
.cat .dot::after{content:'';position:absolute;inset:3px;border-radius:50%;background:var(--c-live)}
.hrow{display:flex;align-items:center;gap:4px;margin:18px 2px 10px}
.hrow h3{font-size:22px;font-weight:800;letter-spacing:-.025em}
.hrow .chev{color:var(--sub);margin-top:2px}
.hrow .more{margin-left:auto;font-size:15px;font-weight:600;color:var(--blue)}
.hrow .ctx{margin-left:auto;font-size:13px;font-weight:600;color:var(--sub)}
.cards{display:flex;gap:10px;margin-right:-16px}
.pc{position:relative;flex:none;width:158px;height:118px;border-radius:20px;overflow:hidden;background:#333}
.pc img{width:100%;height:100%;object-fit:cover;display:block}
.pc::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 30%,rgba(0,0,0,.78))}
.pc .pct{position:absolute;left:11px;right:10px;bottom:9px;z-index:2;color:#fff}
.pc .pct b{display:block;font-size:15px;font-weight:800;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc .pct>span{display:block;font-size:12.5px;font-weight:600;opacity:.92;margin-top:2px;white-space:nowrap}
.pc .pct .open{color:#7CF29A}
.tag{position:absolute;left:9px;top:9px;z-index:2;padding:3px 8px;border-radius:9px;font-size:11px;font-weight:800;letter-spacing:.02em;color:#fff;background:rgba(0,0,0,.55);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.tag.gold{background:rgba(255,196,60,.92);color:#2A1E00}
.pc.tall{width:150px;height:196px}
.pc .pct>.friends{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:12px;font-weight:600}
.avs{display:flex}
.av{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;color:#fff;box-shadow:0 0 0 2px rgba(0,0,0,.5);margin-left:-6px}
.av:first-child{margin-left:0}

/* rows */
.rowi{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.rowi:last-child{border-bottom:0}
.rowi .th{width:66px;height:66px;border-radius:16px;overflow:hidden;flex:none;position:relative}
.rowi .th img{width:100%;height:100%;object-fit:cover}
.rowi .rt{flex:1;min-width:0}
.rowi .rt b{display:block;font-size:17px;font-weight:700;letter-spacing:-.015em}
.rowi .why{font-size:14px;color:var(--text);opacity:.86;margin-top:2px;line-height:1.3}
.rowi .meta{font-size:13.5px;color:var(--sub);margin-top:3px;font-weight:500}
.open{color:var(--open);font-weight:700}
.soon{color:var(--soon);font-weight:700}
.go{width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;flex:none}

/* chips */
.chips{display:flex;gap:8px;margin-right:-16px;overflow:hidden}
.chip{flex:none;height:36px;padding:0 14px;border-radius:18px;background:var(--chip);display:flex;align-items:center;gap:6px;font-size:14.5px;font-weight:600;white-space:nowrap}
.chip.on{background:var(--chip-on);color:var(--chip-on-fg)}

/* greeting */
.greet{display:flex;align-items:flex-start;gap:12px}
.greet h2{font-size:28px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.greet p{font-size:14.5px;color:var(--sub);margin-top:4px;font-weight:500}
.wide{display:flex;gap:12px;align-items:center;padding:10px;border-radius:20px;background:var(--card)}
.wide .th{width:92px;height:92px;border-radius:14px;overflow:hidden;flex:none}
.wide .th img{width:100%;height:100%;object-fit:cover}
.wide b{font-size:17px;font-weight:700;display:block}
.wide .meta{font-size:13.5px;color:var(--sub);margin-top:3px;font-weight:500;line-height:1.35}
.pill{display:inline-flex;align-items:center;gap:5px;margin-top:8px;height:30px;padding:0 12px;border-radius:15px;background:var(--blue);color:#fff;font-weight:700;font-size:13.5px}
.pill.ghost{background:var(--chip);color:var(--text)}

/* answer */
.ans h2{font-size:22px;font-weight:800;letter-spacing:-.025em;line-height:1.2}
.ans p{font-size:13.5px;color:var(--sub);margin-top:4px;font-weight:500;display:flex;align-items:center;gap:5px}
.mini{position:relative;height:206px;border-radius:22px;overflow:hidden;margin-top:12px;box-shadow:0 0 0 1px var(--line)}
.rank{position:absolute;left:-5px;top:-5px;width:22px;height:22px;border-radius:50%;background:var(--blue);color:#fff;font-size:12px;font-weight:800;display:grid;place-items:center;box-shadow:0 0 0 2px var(--glass-bd)}

/* place */
.ptitle{display:flex;align-items:flex-start;gap:10px}
.ptitle h1{font-size:29px;font-weight:800;letter-spacing:-.035em;line-height:1.08}
.ptitle .sub{font-size:15px;color:var(--sub);margin-top:4px;font-weight:500}
.xbtn{width:34px;height:34px;border-radius:50%;background:var(--chip);display:grid;place-items:center;color:var(--sub);flex:none}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.act{height:62px;border-radius:16px;background:var(--chip);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12.5px;font-weight:700;color:var(--blue)}
.act.pri{background:var(--blue);color:#fff}
.stats{display:grid;grid-template-columns:repeat(4,1fr);margin-top:14px;padding:10px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.stat{padding:0 8px;border-left:1px solid var(--line)}
.stat:first-child{border-left:0;padding-left:2px}
.stat small{display:block;font-size:10.5px;font-weight:700;letter-spacing:.05em;color:var(--sub);text-transform:uppercase}
.stat b{display:flex;align-items:center;gap:4px;font-size:16px;font-weight:800;margin-top:3px;white-space:nowrap}
.photos{display:flex;gap:6px;margin-top:14px;margin-right:-16px}
.photos .ph{flex:none;height:132px;border-radius:16px;overflow:hidden}
.photos .ph img{height:100%;width:100%;object-fit:cover}
.fline{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:14.5px;font-weight:600}

<body>
<script>
(async function () {
  const Q = new URLSearchParams(location.search);
  const SCREEN = Q.get('s') || 'a';
  document.documentElement.dataset.theme = Q.get('t') || 'apple';
  const MAPS = { z16: { file: 'map.svg', scale: 1 }, z14: { file: 'map14.svg', scale: 0.5 } };
  const OX = 19831.867 * 256 - 920, OY = 24240.75 * 256 - 680;
  function z16(lat, lon) {
    const x = (lon + 180) / 360 * 256 * 65536;
    const s = Math.sin(lat * Math.PI / 180);
    const y = (0.5 - Math.log((1 + s) / (1 - s)) / (4 * Math.PI)) * 256 * 65536;
    return [x - OX, y - OY];
  }
  const IC = {
    search: '<circle cx="11" cy="11" r="7.5"/><path d="m20.5 20.5-4.2-4.2"/>',
    utensils: '<path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/>',
    martini: '<path d="M8 22h8"/><path d="M12 11v11"/><path d="m19 3-7 8-7-8Z"/>',
    beer: '<path d="M17 11h1a3 3 0 0 1 0 6h-1"/><path d="M9 12v6"/><path d="M13 12v6"/><path d="M14 7.5c-1 0-1.44.5-3 .5s-2-.5-3-.5-1.72.5-2.5.5a2.5 2.5 0 0 1 0-5c.78 0 1.57.5 2.5.5S9.44 2 11 2s2 1.5 3 1.5 1.72-.5 2.5-.5a2.5 2.5 0 0 1 0 5c-.78 0-1.5-.5-2.5-.5Z"/><path d="M5 8v12a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V8"/>',
    bag: '<path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/>',
    landmark: '<path d="M3 22h18"/><path d="M6 18v-7"/><path d="M10 18v-7"/><path d="M14 18v-7"/><path d="M18 18v-7"/><path d="M12 2l8 5H4Z"/>',
    radio: '<path d="M4.9 19.1C1 15.2 1 8.8 4.9 4.9"/><path d="M7.8 16.2c-2.3-2.3-2.3-6.1 0-8.5"/><circle cx="12" cy="12" r="2"/><path d="M16.2 7.8c2.3 2.3 2.3 6.1 0 8.5"/><path d="M19.1 4.9C23 8.8 23 15.1 19.1 19"/>',
    wrench: '<path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>',
    book: '<path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/>',
    flower: '<circle cx="12" cy="12" r="3"/><path d="M12 16.5A4.5 4.5 0 1 1 7.5 12 4.5 4.5 0 1 1 12 7.5a4.5 4.5 0 1 1 4.5 4.5 4.5 4.5 0 1 1-4.5 4.5"/>',
    fish: '<path d="M6.5 12c.94-3.46 4.94-6 8.5-6 3.56 0 6.06 2.54 7 6-.94 3.47-3.44 6-7 6s-7.56-2.53-8.5-6Z"/><path d="M18 12v.5"/><path d="M7 10.67C7 8 5.58 5.97 2.73 5.5c-1 1.5-1 5 .23 6.5-1.24 1.5-1.24 5-.23 6.5C5.58 18.03 7 16 7 13.33"/>',
    tree: '<path d="M12 22v-7"/><path d="M8 15h8l-2.5-3.5H16L12 5l-4 6.5h2.5Z"/>',

    nav: '<path d="M3 11l19-9-9 19-2-8-8-2Z"/>',
    heart: '<path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>',
    bookmark: '<path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"/>',
    share: '<path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><path d="M16 6l-4-4-4 4"/><path d="M12 2v13"/>',
    sparkles: '<path d="M9.94 15.5A2 2 0 0 0 8.5 14.06l-6.14-1.58a.5.5 0 0 1 0-.96L8.5 9.94A2 2 0 0 0 9.94 8.5l1.58-6.14a.5.5 0 0 1 .96 0L14.06 8.5a2 2 0 0 0 1.44 1.44l6.14 1.58a.5.5 0 0 1 0 .96L15.5 14.06a2 2 0 0 0-1.44 1.44l-1.58 6.14a.5.5 0 0 1-.96 0Z"/>',
    chev: '<path d="m9 18 6-6-6-6"/>',
    x: '<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
    coffee: '<path d="M10 2v2"/><path d="M14 2v2"/><path d="M16 8a1 1 0 0 1 1 1v8a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4V9a1 1 0 0 1 1-1h14a4 4 0 1 1 0 8h-1"/><path d="M6 2v2"/>',
    gift: '<rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13"/><path d="M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7"/><path d="M7.5 8a2.5 2.5 0 0 1 0-5C9.5 3 11 5 12 8c1-3 2.5-5 4.5-5a2.5 2.5 0 0 1 0 5"/>',
    umbrella: '<path d="M22 12a10.06 10.06 1 0 0-20 0Z"/><path d="M12 12v8a2 2 0 0 0 4 0"/><path d="M12 2v1"/>',
    cloudmoon: '<path d="M10.19 8.5A6 6 0 0 1 16 4a1 1 0 0 0 6 6 6 6 0 0 1-3 5.2"/><path d="M13 16a3 3 0 1 1 0 6H7a5 5 0 1 1 4.9-6Z"/>',
    user: '<circle cx="12" cy="8" r="4.2"/><path d="M4 21a8 8 0 0 1 16 0"/>',
    check: '<path d="M20 6 9 17l-5-5"/>',
    globe: '<circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>',
    award: '<circle cx="12" cy="8" r="6"/><path d="M15.48 12.89 17 22l-5-3-5 3 1.52-9.11"/>',
    walk: '<circle cx="13" cy="4" r="2"/><path d="M15 22l-2-6-3-3 1-6"/><path d="M8 13l-2 9"/><path d="M11 7 7 9v4"/><path d="M11 7l3 4 4 1"/>',
    music: '<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>',
    checkin: '<path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><path d="m9 10 2 2 4-4"/>',
    clock: '<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
    moon: '<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>',
    camera: '<path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/>',
    signal: '<path d="M2 20h.01"/><path d="M7 20v-4"/><path d="M12 20v-8"/><path d="M17 20V8"/>',
  };
  const ic = (n, s = 20, w = 2, cls = '') => `<svg class="ic ${cls}" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${IC[n]}</svg>`;
  const HEART = (s) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24"><path fill="#FF3B4E" d="M12 21.2s-7.6-4.7-9.7-9.3C.8 8.6 2.6 4.4 6.6 4c2.2-.2 3.9.9 5.4 2.9C13.5 4.9 15.2 3.8 17.4 4c4 .4 5.8 4.6 4.3 7.9-2.1 4.6-9.7 9.3-9.7 9.3z"/></svg>`;
  const AVC = { S: '#FF7A59', P: '#8B5CF6', L: '#16A34A', K: '#0EA5E9', A: '#F59E0B' };
  const avs = (list) => `<span class="avs">${list.map((n) => `<span class="av" style="background:${AVC[n[0]]}">${n[0]}</span>`).join('')}</span>`;

  const PL = {
    sign: [42.3555, -71.0603], florabella: [42.3553, -71.0596], brattle: [42.3547, -71.0619], opera: [42.3540, -71.0624], drphil: [42.3545, -71.0633],
    paku: [42.3535, -71.0615], commonL: [42.3567, -71.0646], oldstate: [42.3587, -71.0575], genki: [42.3524, -71.0630], faneuil: [42.3600, -71.0560],
    chinatown: [42.3510, -71.0605], yvonnes: [42.3561, -71.0617], silvertone: [42.3567, -71.0611], tam: [42.3518, -71.0645], blackrose: [42.3596, -71.0539],
    bellinhand: [42.3612, -71.0572], unionoyster: [42.3612, -71.0569], parkst: [42.3564, -71.0624], state: [42.3588, -71.0577], market: [42.3549, -71.0591],
    dumpling: [42.3545, -71.0608], macys: [42.3548, -71.0598], primark: [42.3559, -71.0597],
  };

  const res = await Promise.all(Object.entries(MAPS).map(async ([k, m]) => [k, await (await fetch(m.file)).text()]));
  const SVG = Object.fromEntries(res);

  function mapBox({ map = 'z16', box = [0, 0, 390, 844], at, sx, sy, pins = [], route = null, radius = 0, extra = '', attrY = null }) {
    const m = MAPS[map];
    const toMap = (ll) => { const p = z16(ll[0], ll[1]); return [p[0] * m.scale, p[1] * m.scale]; };
    const c = toMap(at);
    const tx = sx - c[0], ty = sy - c[1];
    const scr = (ll) => { const p = toMap(ll); return [tx + p[0], ty + p[1]]; };
    let routeSVG = '';
    if (route) {
      const pts = route.map((ll) => scr(ll).map((v) => v.toFixed(1)).join(',')).join(' ');
      routeSVG = `<svg class="route" width="${box[2]}" height="${box[3]}"><polyline points="${pts}" fill="none" stroke="rgba(0,0,0,.35)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><polyline points="${pts}" fill="none" stroke="#2F95FF" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="0.1 9"/></svg>`;
    }
    const pinHTML = pins.map((p) => pin(p, p.xy || scr(p.at))).join('');
    return `<div class="mapbox" style="left:${box[0]}px;top:${box[1]}px;width:${box[2]}px;height:${box[3]}px;border-radius:${radius}px">
      <div class="mapsvg" style="transform:translate(${tx.toFixed(1)}px,${ty.toFixed(1)}px)">${SVG[map]}</div>${routeSVG}<div class="pins">${pinHTML}</div>${extra}${attrY != null ? `<span class="attr" style="top:${attrY}px">© OpenStreetMap</span>` : ''}</div>`;
  }
  function pin(p, [x, y]) {
    const st = `left:${x.toFixed(1)}px;top:${y.toFixed(1)}px`;
    const lbl = p.label ? `<span class="pl">${p.label}${p.small ? `<small>${p.small}</small>` : ''}</span>` : '';
    switch (p.type) {
      case 'you': return `<div class="you" style="${st}"><i></i>${p.label ? `<span class="yl glass">${p.label}</span>` : ''}</div>`;
      case 'photo': return `<div class="pbub ${p.cls || ''}" style="${st}"><span class="pimg"><img src="${p.img}"></span>${p.label ? `<span class="pbl">${p.label}</span>` : ''}${p.rank ? `<span class="rank">${p.rank}</span>` : ''}</div>`;
      case 'T': return `<div class="tst ${p.side || ''}" style="${st}">T${p.label ? `<span class="tl">${p.label}</span>` : ''}</div>`;
      case 'walk': return `<div class="walkchip" style="${st}">${ic('walk', 12, 2.6)}${p.label}</div>`;
      case 'num': return `<div class="num ${p.side || ''}" style="${st}">${p.n}${p.label ? `<span class="pl">${p.label}</span>` : ''}</div>`;
      case 'hl': return `<div class="hl ${p.cls || ''}" style="${st}">${p.label}</div>`;
      default: return `<div class="poi ${p.side || 'r'} ${p.cls || ''}" style="${st};--c:var(--c-${p.cat});--cl:var(--c-${p.cat}-l)"><span class="pg">${ic(p.icon, p.cls && p.cls.includes('big') ? 18 : 15, 2.5)}</span>${lbl}${p.rank ? `<span class="rank">${p.rank}</span>` : ''}</div>`;
    }
  }
  const statusBar = (t = '6:48') => `<div class="island"></div><div class="sb"><span>${t}</span><span class="ico">
      <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1" fill="currentColor"/><rect x="5" y="5.5" width="3" height="6.5" rx="1" fill="currentColor"/><rect x="10" y="3" width="3" height="9" rx="1" fill="currentColor"/><rect x="15" y="0" width="3" height="12" rx="1" fill="currentColor"/></svg>
      <svg width="16" height="12" viewBox="0 0 16 12"><path d="M8 11.5 5.6 9a3.4 3.4 0 0 1 4.8 0Z M3.4 6.8a6.5 6.5 0 0 1 9.2 0l-1.5 1.5a4.4 4.4 0 0 0-6.2 0Z M1.2 4.6a9.6 9.6 0 0 1 13.6 0l-1.5 1.5a7.5 7.5 0 0 0-10.6 0Z" fill="currentColor"/></svg>
      <svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.6" fill="none" stroke="currentColor" opacity=".45"/><rect x="2" y="2" width="17" height="9" rx="2.2" fill="currentColor"/><path d="M25 4.5v4a2 2 0 0 0 0-4Z" fill="currentColor" opacity=".5"/></svg></span></div>`;
  const topfade = () => '<div class="topfade"></div>';
  const brand = () => `<div class="brand glass"><span class="bn">I ${HEART(17)} BOSTON</span><span class="lang">${ic('globe', 14, 2.2)}EN</span></div>`;
  const wx = () => `<div class="wx glass">${ic('cloudmoon', 18, 2)}46°</div>`;
  const cat = (label, sub, icon, c1, c2, live) => `<div class="cat"><span class="cc" style="--c1:${c1};--c2:${c2}">${ic(icon, 26, 2.1)}${live ? '<span class="dot"></span>' : ''}</span><b>${label}</b><small>${sub}</small></div>`;
  const pcard = (img, name, meta, tag, cls = '', extra = '') => `<div class="pc ${cls}"><img src="${img}">${tag || ''}<div class="pct"><b>${name}</b><span>${meta}</span>${extra}</div></div>`;

  let html = '';

  /* ======== A · Simple: the map + one search sheet ======== */
  if (SCREEN === 'a') {
    html += mapBox({ at: PL.sign, sx: 195, sy: 310, attrY: 452, pins: [
      { xy: [10, 306], type: 'hl', cls: 'la', label: 'Boston<br>Common' },
      { at: PL.parkst, type: 'T', label: 'Park St', side: 'l' },
      { at: PL.oldstate, type: 'photo', img: '../p/oldstate-0-t.webp', label: 'Old State House' },
      { at: PL.silvertone, cat: 'drinks', icon: 'beer', label: 'Silvertone', side: 'r' },
      { at: PL.yvonnes, cat: 'drinks', icon: 'martini', label: "Yvonne's", side: 'l' },
      { at: PL.brattle, cat: 'shop', icon: 'book', label: 'Brattle Book Shop', side: 'r' },
      { at: [42.3551, -71.0596], cat: 'shop', icon: 'flower', label: 'Florabella', side: 'r', small: 'Sponsored' },
      { at: PL.opera, type: 'photo', cls: 'sm', img: '../p/opera-0-t.webp', label: 'Opera House' },
      { at: PL.drphil, cat: 'svc', icon: 'wrench', label: 'Dr Phil Repair', side: 't' },
      { at: [42.3535, -71.0610], cat: 'eat', icon: 'utensils', label: 'Paku Katsuya', side: 'r' },
      { at: [42.3540, -71.0592], cls: 'live', cat: 'live', icon: 'radio', label: 'Holiday market', side: 'r', small: 'Live now' },
      { at: PL.sign, type: 'you', label: `${HEART(12)}You're here` },
    ] });
    html += topfade() + statusBar() + brand();
    html += `<div class="sheet glass" style="top:470px"><div class="in"><div class="grab"></div>

      <div class="cats">
        ${cat('Eat', '12 open', 'utensils', '#FFB066', '#EE7A2B')}
        ${cat('Drinks', '5 open', 'martini', '#C996FF', '#9152F0')}
        ${cat('Shop', '9 open', 'bag', '#FFD25C', '#E5A00F')}
        ${cat('See', '10 spots', 'landmark', '#7FDB9A', '#2FA65A')}
        ${cat('Live', '4 now', 'radio', '#FF8A7E', '#F0443A', true)}
      </div>
      <div class="hrow"><h3>Right now</h3><span class="chev">${ic('chev', 20, 2.6)}</span><span class="ctx">${ic('moon', 13, 2.4)} 6:48 PM · 46°</span></div>
      <div class="cards">
        ${pcard('../p/silvertone-0.webp', 'Silvertone', '<span class="open">Open</span> · 3 min · Bar')}
        ${pcard('../p/florabella-0.webp', 'Florabella Flowers', '<span class="open">Open</span> · 1 min', '<span class="tag">Sponsored</span>')}
        ${pcard('../p/paku-0.webp', 'Paku Katsuya', '4 min · Katsu', '<span class="tag gold">Critics\' pick</span>')}
      </div></div></div>`;
  }

  /* ======== B · Right now: a smart feed that changes with the time ======== */
  if (SCREEN === 'b') {
    html += mapBox({ map: 'z16', at: PL.sign, sx: 236, sy: 205, attrY: 268, pins: [
      { at: PL.parkst, type: 'T', label: 'Park St', side: 'l' },
      { at: PL.silvertone, cat: 'drinks', icon: 'beer', label: 'Silvertone', side: 'r' },
      { at: PL.yvonnes, cat: 'drinks', icon: 'martini', label: "Yvonne's", side: 'l' },
      { at: PL.market, cls: 'live', cat: 'live', icon: 'radio', label: 'Market', side: 'r' },
      { at: PL.sign, type: 'you' },
    ] });
    html += topfade() + statusBar() + brand();
    html += `<div class="sheet glass" style="top:286px"><div class="in"><div class="grab"></div>
      <div class="greet"><div style="flex:1"><h2>Good evening</h2><p>Thursday, 6:48 PM · 46° and clear. Here's what's good near the sign right now.</p></div><div class="avatar" style="width:44px;height:44px">${ic('user', 21, 2.2)}</div></div>
      <div class="hrow" style="margin-top:16px"><h3 style="font-size:19px">Drinks, open now</h3><span class="more">See all</span></div>
      <div class="cards">
        ${pcard('../p/silvertone-0.webp', 'Silvertone', '3 min · till 2 AM', '', 'tall', `<span class="friends">${avs(['Sam', 'Priya'])}Sam & Priya</span>`)}
        ${pcard('../p/yvonnes-0.webp', "Yvonne's", '2 min · till 1 AM', '', 'tall', '<span class="friends" style="opacity:.9">Cocktails</span>')}
        ${pcard('../p/bellinhand-0.webp', 'Bell in Hand', '9 min · till 2 AM', '', 'tall', `<span class="friends">${avs(['Priya', 'Leo'])}Priya & Leo</span>`)}
      </div>
      <div class="hrow" style="margin-top:18px"><h3 style="font-size:19px">Tonight</h3><span class="more">See all</span></div>
      <div class="wide"><div class="th"><img src="../p/opera-0-t.webp"></div><div style="flex:1;min-width:0"><b>Tonight's musical</b><div class="meta">Boston Opera House · 7:30 PM<br><span class="soon">Starts in 42 min</span> · 2 min walk</div><span class="pill ghost">${ic('ticket', 15, 2.2)}Details</span></div></div>
      <div class="hrow" style="margin-top:18px"><h3 style="font-size:19px">Dinner people love</h3><span class="more">See all</span></div>
      </div></div>`;
  }

  /* ======== C · Just ask: say what you want, get 3 good answers ======== */
  if (SCREEN === 'c') {
    html += mapBox({ at: PL.sign, sx: 195, sy: 200, pins: [] });
    html += statusBar();
    const mini = mapBox({ map: 'z14', box: [0, 0, 342, 206], at: [42.35428, -71.0619], sx: 171, sy: 103, attrY: 188, pins: [
      { at: PL.yvonnes, type: 'num', n: 1, label: "Yvonne's", side: 'l' },
      { at: PL.silvertone, type: 'num', n: 2, label: 'Silvertone' },
      { at: PL.tam, type: 'num', n: 3, label: 'The Tam' },
      { at: PL.sign, type: 'you' },
    ] });
    html += `<div class="sheet glass" style="top:58px"><div class="in"><div class="grab"></div>
      <div class="srow"><div class="field" style="border:1.5px solid var(--blue)">${ic('sparkles', 20, 2.1)}<b>a drink nearby</b><span style="margin-left:auto;display:grid">${ic('x', 18, 2.4)}</span></div></div>
      <div class="chips" style="margin-top:12px">
        <span class="chip">${ic('coffee', 16, 2.2)}Coffee</span><span class="chip">${ic('utensils', 16, 2.2)}Quick bite</span><span class="chip on">${ic('martini', 16, 2.2)}A drink</span><span class="chip">${ic('gift', 16, 2.2)}Free stuff</span><span class="chip">${ic('umbrella', 16, 2.2)}Rainy day</span>
      </div>
      <div class="ans" style="margin-top:16px"><h2>3 bars open now, all under 5 min away</h2><p>${ic('sparkles', 13, 2.4)}Picked for a Thursday at 6:48 PM, closest first</p></div>
      <div class="mini">${mini}</div>
      <div style="margin-top:6px">
        <div class="rowi"><div class="th"><img src="../p/yvonnes-0-t.webp"><span class="rank" style="left:4px;top:4px">1</span></div><div class="rt"><b>Yvonne's</b><div class="why">Cocktails in a grand old supper club</div><div class="meta"><span class="open">Open till 1 AM</span> · 2 min walk</div></div><span class="go">${ic('nav', 18, 2.4)}</span></div>
        <div class="rowi"><div class="th"><img src="../p/silvertone-0-t.webp"><span class="rank" style="left:4px;top:4px">2</span></div><div class="rt"><b>Silvertone Bar & Grill</b><div class="why" style="display:flex;align-items:center;gap:6px">${avs(['Sam', 'Priya'])}Sam & Priya recommend</div><div class="meta"><span class="open">Open till 2 AM</span> · 3 min walk</div></div><span class="go">${ic('nav', 18, 2.4)}</span></div>
        <div class="rowi"><div class="th"><img src="../p/tam-0-t.webp"><span class="rank" style="left:4px;top:4px">3</span></div><div class="rt"><b>The Tam</b><div class="why">A no-frills dive, easy on the wallet</div><div class="meta"><span class="open">Open till 2 AM</span> · 5 min walk</div></div><span class="go">${ic('nav', 18, 2.4)}</span></div>
      </div>
      <div class="chips" style="margin-top:10px"><span class="chip">Quieter</span><span class="chip">Cheaper</span><span class="chip">With food</span><span class="chip">Live music</span></div>
      </div></div>`;
  }

  /* ======== P · A place, simplified ======== */
  if (SCREEN === 'p') {
    html += mapBox({ at: PL.paku, sx: 150, sy: 206, attrY: 244, route: [PL.sign, [42.3550, -71.0606], [42.3545, -71.0610], [42.3540, -71.0612], PL.paku], pins: [
      { at: PL.brattle, cat: 'shop', icon: 'book', cls: 'dim' },
      { at: PL.opera, cat: 'see', icon: 'ticket', cls: 'dim' },
      { at: PL.paku, cat: 'eat', icon: 'utensils', cls: 'big', label: 'Paku Katsuya', side: 'r' },
      { at: PL.sign, type: 'you' },
    ] });
    html += topfade() + statusBar();
    html += `<div class="sheet glass" style="top:262px"><div class="in"><div class="grab"></div>
      <div class="ptitle"><div style="flex:1"><h1>Paku Katsuya</h1><div class="sub">Japanese · Katsu · <span class="open">Open</span> till 9 PM</div></div><span class="xbtn">${ic('share', 17, 2.3)}</span><span class="xbtn">${ic('x', 17, 2.6)}</span></div>
      <div class="acts">
        <div class="act pri">${ic('nav', 20, 2.3)}4 min</div>
        <div class="act">${ic('heart', 20, 2.3)}Recommend</div>
        <div class="act">${ic('checkin', 20, 2.3)}Check in</div>
        <div class="act">${ic('bookmark', 20, 2.3)}Save</div>
      </div>
      <div class="stats">
        <div class="stat"><small>Loved by</small><b>${ic('heart', 15, 2.6)}42</b></div>
        <div class="stat"><small>Critics</small><b style="color:var(--c-shop-l)">${ic('award', 15, 2.6)}Pick</b></div>
        <div class="stat"><small>Price</small><b>$$</b></div>
        <div class="stat"><small>Walk</small><b>4 min</b></div>
      </div>
      <div class="photos"><div class="ph" style="width:190px"><img src="../p/paku-0.webp"></div><div class="ph" style="width:132px"><img src="../p/paku-1.webp"></div><div class="ph" style="width:132px"><img src="../p/paku-2.webp"></div></div>
      <div class="fline">${avs(['Leo'])}Your friend Leo recommends it</div>
      <div class="quote"><p>“Crispy, generous katsu, and one of the easiest good lunches downtown.”</p><footer>${ic('award', 13, 2.4)}A local food critic</footer></div>
      </div></div>`;
  }

  document.body.innerHTML = html;
  const obs = [...document.querySelectorAll('.poi .pg, .poi .pl, .pbub .pimg, .pbub .pbl, .tst, .tst .tl, .you i, .you .yl, .hl, .num, .num .pl, .walkchip, .brand, .island')].map((e) => e.getBoundingClientRect());
  const hit = (x0, y0, x1, y1) => obs.some((o) => !(x1 < o.left - 3 || x0 > o.right + 3 || y1 < o.top - 3 || y0 > o.bottom + 3));
  document.querySelectorAll('.rmap text').forEach((t) => {
    const m = t.getScreenCTM(); let bad = false;
    const n = t.getNumberOfChars();
    for (let i = 0; i < n && !bad; i++) {
      let r; try { r = t.getExtentOfChar(i); } catch (e) { continue; }
      const x0 = r.x * m.a + m.e, y0 = r.y * m.d + m.f;
      if (hit(x0, y0, x0 + r.width * m.a, y0 + r.height * m.d)) bad = true;
    }
    if (!bad) { const b = t.closest('.mapbox').getBoundingClientRect(), r = t.getBoundingClientRect(); if (r.left < b.left + 2 || r.right > b.right - 2 || r.top < b.top + 2 || r.bottom > b.bottom - 2) bad = true; }
    if (bad) t.style.display = 'none';
  });
  await Promise.all([...document.images].map((im) => im.complete ? 0 : new Promise((r) => { im.onload = im.onerror = r; })));
  document.body.dataset.ready = '1';
})();
</script>
