*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg)}
body{font-family:var(--font);color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;max-width:480px;margin:0 auto;min-height:100vh;overflow-x:hidden;position:relative}
body.intro-on{overflow:hidden}
body::before{content:'';position:fixed;left:0;right:0;top:0;height:460px;background:var(--glow);pointer-events:none;z-index:0}
#app{position:relative;z-index:1}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
img{display:block}
.ic{flex:none}

/* ---------- Liquid Glass ---------- */
.glass{position:relative;background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(1.9);backdrop-filter:blur(20px) saturate(1.9);border:1px solid var(--glass-bd);box-shadow:var(--glass-shadow),inset 0 1px 0 var(--glass-hi)}
.glass::after{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(180deg,rgba(255,255,255,.32),rgba(255,255,255,0) 46%);mix-blend-mode:soft-light}

/* ---------- header ---------- */
.top{display:flex;align-items:center;justify-content:space-between;padding:max(14px,env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) 10px calc(16px + env(safe-area-inset-left))}
.logo{display:flex;align-items:center;gap:6px;font-family:var(--logo);font-weight:900;font-size:21px;letter-spacing:.03em}
.logo svg{width:22px;height:22px}
.lang{display:flex;align-items:center;gap:6px;height:38px;padding:0 13px;border-radius:19px;font-weight:700;font-size:14px}

/* ---------- home: the map card is the "you're here" ---------- */
.hero{position:relative;display:block;margin:2px 16px 0;height:300px;border-radius:30px;overflow:hidden;background:var(--m-land);box-shadow:0 0 0 1px var(--line),0 12px 30px rgba(19,34,74,.10);transition:transform .2s var(--ease)}
.hero:active{transform:scale(.985)}
.hero .map{position:absolute;inset:0}
.hero .ttl{position:absolute;left:12px;top:12px;max-width:calc(100% - 24px);padding:11px 15px 13px;border-radius:22px;z-index:3}
.hero .ttl .kick,.hero .ttl .h1{width:max-content;max-width:100%}
.kick{display:flex;align-items:center;gap:7px;font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.kick .ok{width:17px;height:17px;border-radius:50%;background:var(--accent);display:grid;place-items:center;color:#fff}
.hero .h1{display:block;font-family:var(--disp);font-weight:800;font-size:27px;line-height:1.05;letter-spacing:-.02em;margin-top:6px;white-space:nowrap}
.go{position:absolute;right:12px;bottom:12px;z-index:3;display:flex;align-items:center;gap:7px;height:40px;padding:0 15px;border-radius:20px;font-weight:700;font-size:14px}
.go.sm{height:34px;padding:0 12px;font-size:13px;right:10px;bottom:10px}
.attr{position:absolute;left:12px;bottom:9px;z-index:3;font-size:9.5px;font-weight:600;color:var(--m-lbl);opacity:.85;-webkit-text-stroke:2.5px var(--m-halo);paint-order:stroke fill;white-space:nowrap}

/* ---------- sections ---------- */
.sec{font-family:var(--disp);font-weight:800;font-size:21px;letter-spacing:-.015em;padding:0 18px;margin:26px 0 12px}
.sec-row{display:flex;align-items:baseline;justify-content:space-between;padding-right:18px}
.note{font-size:11.5px;font-weight:700;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:0 16px}
.tile{position:relative;height:86px;border-radius:20px;background:var(--t);border:2px solid var(--tile-bd);box-shadow:0 4px 0 var(--tile-sh);padding:11px 12px;display:flex;flex-direction:column;justify-content:space-between;color:#13224A;transition:transform .15s var(--ease),box-shadow .15s var(--ease)}
.tile:active{transform:translateY(3px);box-shadow:0 1px 0 var(--tile-sh)}
.tile b{font-size:15.5px;font-weight:700}
.tile .live{position:absolute;right:10px;top:12px;display:flex;align-items:center;gap:5px;font-size:11px;font-weight:800;color:#B4232F}
.live i,.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px rgba(230,57,70,.22);animation:blink 1.6s ease-in-out infinite}
@keyframes blink{50%{box-shadow:0 0 0 5px rgba(230,57,70,.08)}}
.feat{display:flex;gap:12px;overflow-x:auto;padding:0 16px 8px;scroll-snap-type:x mandatory;scrollbar-width:none}
.feat::-webkit-scrollbar,.mcards::-webkit-scrollbar,.chips::-webkit-scrollbar,.strip::-webkit-scrollbar{display:none}
.fcard{display:block;flex:none;width:280px;border-radius:24px;background:var(--surface);box-shadow:0 0 0 1px var(--line);overflow:hidden;scroll-snap-align:start}
.fcard .ph{display:block;position:relative;height:146px;background:#888}
.fcard .ph img{width:100%;height:100%;object-fit:cover}
.feat.top .fcard{width:248px}
.feat.top .fcard .ph{height:112px}
.tag{position:absolute;left:10px;top:10px;padding:4px 9px;border-radius:9px;background:rgba(10,17,36,.78);color:#fff;font-size:10.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase}
.fcard .ft{display:block;padding:12px 14px 14px}
.fcard b{display:block;font-size:17px;font-weight:700}
.fcard .m{display:block;font-size:14px;color:var(--muted);margin-top:2px}
.deal{display:inline-flex;align-items:center;gap:6px;margin-top:9px;padding:5px 10px;border-radius:10px;background:var(--deal-bg);color:var(--deal-ink);font-size:13px;font-weight:700}
.bizline{display:flex;width:calc(100% - 32px);align-items:center;justify-content:space-between;gap:10px;margin:22px 16px 0;padding:15px 16px;border-radius:20px;background:var(--surface);box-shadow:0 0 0 1px var(--line);font-size:14.5px;font-weight:600;text-align:left}
.bizline b{display:flex;align-items:center;gap:2px;color:var(--accent);flex:none;white-space:nowrap}
.foot{padding:18px 18px 0;font-size:12px;color:var(--muted);line-height:1.6}
.foot button{text-decoration:underline;font-weight:600;color:var(--ink)}
.tabspace{height:calc(112px + env(safe-area-inset-bottom))}

/* rows */
.list{margin:0 16px;border-radius:22px;background:var(--surface);box-shadow:0 0 0 1px var(--line);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:10px 12px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row img{width:58px;height:58px;border-radius:15px;object-fit:cover;background:#888}
.row .t{flex:1;min-width:0}
.row b{display:block;font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .m{display:block;font-size:13.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.open{color:var(--ok);font-weight:700}
.livetxt{color:var(--accent);font-weight:700}
.walk{flex:none;text-align:center;min-width:44px}
.walk b{font-family:var(--disp);font-size:20px;font-weight:800;line-height:1}
.walk span{display:block;font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}

/* ---------- small maps (pictures of the map; tap one to open the big map) ---------- */
.map{position:relative;overflow:hidden;background:var(--m-land)}
.mapin{position:absolute;left:0;top:0;transform-origin:0 0}
.mapin.lo .m-street-lbl,.mapin.lo .m-hood-lbl,.mapin.lo .m-water-lbl{display:none}
.rmap{display:block}
.rmap .m-land{fill:var(--m-land)}
.rmap .m-park,.rmap .m-park2{fill:var(--m-park)}
.rmap .m-wood{fill:var(--m-wood)}
.rmap .m-water{fill:var(--m-water)}
.rmap .m-case{stroke:var(--m-case)}
.rmap .m-ped{stroke:var(--m-ped)}
.rmap .m-minor{stroke:var(--m-minor)}
.rmap .m-major{stroke:var(--m-major)}
.rmap .m-hw{stroke:var(--m-hw)}
.rmap text{font-family:Inter,sans-serif;paint-order:stroke;stroke:var(--m-halo);stroke-width:3px;stroke-linejoin:round}
.rmap .m-street-lbl{fill:var(--m-lbl)}
.rmap .m-hood-lbl{fill:var(--m-hood);font-size:10.5px;letter-spacing:2.2px;font-weight:800}
.rmap .m-water-lbl{fill:var(--m-water-lbl)}
.ringsvg{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.mk{position:absolute;width:28px;height:28px;margin:-14px 0 0 -14px;border-radius:50%;background:var(--c);border:2px solid var(--pin-bd);display:grid;place-items:center;color:#13224A;box-shadow:0 3px 8px rgba(10,17,36,.28);transform:scale(var(--ik,1));transition:transform .3s var(--spring);z-index:2;cursor:pointer}
.mk.sm{width:22px;height:22px;margin:-11px 0 0 -11px}
.mk.sel{transform:scale(calc(var(--ik,1) * 1.35));z-index:5}
.mk .lb{position:absolute;top:calc(100% + 5px);left:50%;transform:translateX(-50%) scale(.74);transform-origin:top center;white-space:nowrap;padding:4px 9px;border-radius:10px;font-size:13px;font-weight:700;color:var(--ink);background:var(--surface);box-shadow:0 2px 8px rgba(10,17,36,.25)}
.mk.live::after{content:'';position:absolute;inset:-7px;border-radius:50%;border:2px solid var(--accent);animation:ping 1.8s ease-out infinite}
.me{position:absolute;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 3px 12px rgba(10,17,36,.35);transform:scale(var(--ik,1));z-index:4}
.me svg{width:20px;height:20px}
.me::before{content:'';position:absolute;inset:-9px;border-radius:50%;background:rgba(230,57,70,.22);animation:ping 2.2s ease-out infinite}

#intro.ready.auto .tring .pr{animation:ringfill var(--hold,2000ms) linear forwards}
@keyframes ringfill{to{stroke-dashoffset:0}}
@keyframes sheen{to{transform:translateX(130%)}}
@keyframes sheenloop{0%{transform:translateX(-130%)}33%,100%{transform:translateX(130%)}}

#intro.fast .qrwrap,#intro.fast .scanline,#intro.fast .iping{display:none}

@keyframes qrOut{to{opacity:0;transform:scale(.15) rotate(-8deg)}}
@keyframes scan{0%{top:12px;opacity:0}12%{opacity:1}88%{opacity:1}100%{top:calc(100% - 16px);opacity:0}}

@keyframes beat{0%,100%{transform:scale(1)}30%{transform:scale(1.18)}60%{transform:scale(.96)}}

@keyframes fromL{from{opacity:0;transform:translateX(10px)}to{opacity:1;transform:none}}

  }
  // the page eases back a little while the map is open, and comes forward again as it closes
  function pageDepth(card, dur, dir) {

  async function openBig(filter, focus, from) {

  /* ---------- router + tabs ---------- */
  const app = document.getElementById('app'), tabbar = document.getElementById('tabbar'), lens = document.getElementById('lens');
  let tabNow = 0, under = null, pendingFrom = null, navs = 0;

    }
    lens.style.transform = end;
  }
  const pageMap = () => document.querySelector('#app [data-open] .map');
  function renderPage(hash) {
    const h = hash.replace(/^#\/?/, '').split('/');
    let tab = 0;
    clearInterval(trainT);
    if (h[0] === 'c') app.innerHTML = listPage(h[1]);
    else if (h[0] === 't') { app.innerHTML = tPage(h[1] || ''); wireT(); }

    setTimeout(prepCam, 60);

    return tab;
  }
  function route() {

    const hash = location.hash || '#/';
    const h = hash.replace(/^#\/?/, '').split('/');
    const iv = document.getElementById('intro');
    if (iv && h[0] && h[0] !== 'mockups') { iv.remove(); document.body.classList.remove('intro-on', 'pins-wait'); document.documentElement.classList.remove('intro-pending'); }

      if (under === null) renderPage('#/');

      moveLens(1, true);

      return;
    }
    const target = '#/' + h.filter(Boolean).join('/');
    if (bigOpen && (target === under || (target === '#/' && under === '#/'))) {
      moveLens(under.startsWith('#/today') ? 2 : 0, true);
      tabbar.classList.toggle('hide', under.startsWith('#/p/'));

    }
    const tab = renderPage(hash);
    moveLens(tab, true);
    if (bigOpen) closeBig(pageMap());
  }
  document.addEventListener('click', (e) => {
    if (e.target.closest('[data-back]')) { if (navs > 0) history.back(); else location.hash = '#/'; return; }
    const op = e.target.closest('[data-open]');
    if (op) pendingFrom = op.querySelector('.map');
    const tab = e.target.closest('.tab[data-tab="1"]');
    if (tab) pendingFrom = pageMap();
  }, true);
  let tt;
  document.addEventListener('click', (e) => { const b = e.target.closest('[data-toast]'); if (!b) return; let t = document.querySelector('.toast'); if (!t) { t = document.createElement('div'); t.className = 'toast'; document.body.appendChild(t); } t.textContent = b.dataset.toast; t.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), 2200); });
  window.addEventListener('hashchange', () => { navs++; route(); });
  route();
  // get the big map ready in the background once things are calm, so it opens at once: after the intro, or soon after the page loads
  let warmed = false;
  const warm = (ms = 1200) => { if (warmed) return; warmed = true; setTimeout(() => ensureMap().catch(() => {}), ms); };
  window.__warm = warm;
  const warmAfterLoad = () => { if (!document.getElementById('intro')) warm(); };
  if (document.readyState === 'complete') setTimeout(warmAfterLoad, 0); else addEventListener('load', warmAfterLoad);
  window.__map = () => map;
  window.__openBig = openBig;
  window.__bm = { staticCam, goalCam, insetOf, setPins, pageMap, el: bigEl, ease: OPEN, closeBig, dClose: D_CLOSE, dOpen: D_OPEN };

  /* ---------- search ---------- */
  const sheet = document.getElementById('ssheet'), sq = document.getElementById('sq'), sres = document.getElementById('sres');
  const SUGS = ['Bar', 'Sushi', 'Flowers', 'Books', 'Phone repair', 'History', 'Live now'];
  function searchRender() {
    const q = sq.value.trim().toLowerCase();
    if (!q) { sres.innerHTML = `<div class="sugs">${SUGS.map((s) => `<button type="button" class="chip glass" data-s="${s}">${s}</button>`).join('')}</div>`; return; }
    const hits = P.filter((p) => (p.name + ' ' + p.kind + ' ' + (CAT[p.cat] || {}).label + (p.live ? ' live now' : '')).toLowerCase().includes(q.replace(/s$/, '')));
    sres.innerHTML = hits.length ? `<div class="list">${hits.map(row).join('')}</div>` : `<p class="empty">Nothing called “${sq.value.replace(/[<>&]/g, '')}” near this sign yet.</p>`;
  }
  const openSearch = () => { sheet.classList.add('on'); sheet.setAttribute('aria-hidden', 'false'); searchRender(); setTimeout(() => sq.focus(), 60); };
  const closeSearch = () => { sheet.classList.remove('on'); sheet.setAttribute('aria-hidden', 'true'); sq.blur(); };
  document.getElementById('openSearch').onclick = openSearch;
  document.getElementById('closeSearch').onclick = () => { sq.value = ''; closeSearch(); };
  sq.addEventListener('input', searchRender);
  sres.addEventListener('click', (e) => { const s = e.target.closest('[data-s]'); if (s) { sq.value = s.dataset.s; searchRender(); return; } if (e.target.closest('a')) closeSearch(); });

  /* ----- the intro: plays when you arrive from a sign's QR code ----- */
  const intro = document.getElementById('intro');
  const onHome = !location.hash || location.hash === '#/';
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!intro || !onHome || reduce || (!CAPTURE && !Q.has('intro') && !fromMockups && sessionStorage.getItem('ilb-intro'))) { if (intro) intro.remove(); document.body.classList.remove('intro-on', 'pins-wait'); document.documentElement.classList.remove('intro-pending'); return; }
  sessionStorage.setItem('ilb-intro', '1');
  const AUTO = Q.get('auto') === '1';   // waits for a tap (Moo, Nov 20: "don't make the intro auto advance"); ?auto=1 moves on by itself
  const BUILD = 2350;                   // when "Tap to explore" shows, counted from when the show starts (ms)
  const HOLD = 2000;                    // how long the finished screen stays up to be read before it moves on (ms)
  intro.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });   // no scrolling the page underneath
  const heart = document.getElementById('iHeart');
  // the heart pops where the QR code is (the middle of the wordmark row), then slides into its spot in I ♥ BOSTON.
  // It's animated from script with real pixel values measured once the screen has settled (sturdier on iPhone than CSS keyframes with variables)
  let heartAnims = [];

    heartAnims.forEach((a) => a.cancel());
    const mk = heart.parentElement, hx = mk.clientWidth / 2 - (heart.offsetLeft + heart.offsetWidth / 2);
    const at = (x, k) => `translateX(${x.toFixed(1)}px) scale(${k})`;

      heart.animate([
        { opacity: 0, transform: at(hx, .01), easing: 'cubic-bezier(.2,.9,.3,1)' },
        { opacity: 1, transform: at(hx, 1.3), offset: .33, easing: 'ease-in-out' },
        { opacity: 1, transform: at(hx, 1), offset: .5, easing: 'cubic-bezier(.2,.8,.2,1)' },
        { opacity: 1, transform: at(0, 1) },
      ], { delay: fast ? 0 : 950, duration: fast ? 1 : 930, fill: 'both' }),
      heart.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.18)', offset: .3 }, { transform: 'scale(.96)', offset: .6 }, { transform: 'scale(1)' }], { delay: fast ? 0 : 2150, duration: fast ? 1 : 500, easing: 'ease-in-out' }),

  // a home-screen launch can start at the wrong size for a moment and then jump: show nothing but navy until the screen size settles

  const sizeKey = () => { const r = probe.getBoundingClientRect(); return [innerWidth, innerHeight, r.left, r.top, r.right, r.bottom].map(Math.round).join(','); };
  const standalone = navigator.standalone === true || matchMedia('(display-mode: standalone)').matches;
  const looksFull = () => { if (!standalone) return true; const a = Math.max(innerWidth, innerHeight), b = Math.min(innerWidth, innerHeight), A = Math.max(screen.width, screen.height), B = Math.min(screen.width, screen.height); return a >= 0.8 * A && b >= 0.8 * B && a <= 1.2 * A && b <= 1.2 * B; };

    const t0 = performance.now(); let key = '', since = t0;
    const tick = (now) => {
      const k = sizeKey();
      if (k !== key) { key = k; since = now; }
      if ((now - since >= (standalone ? 320 : 160) && now - t0 >= 120 && looksFull()) || now - t0 > 2200) { probe.remove(); res(); return; }
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  });
  let shown = false;
  function show() { shown = true; document.documentElement.classList.remove('intro-pending'); intro.classList.add('shown'); }
  let morphing = false;
  function morph(paused) {
    if (morphing) return; morphing = true;
    const hero = document.getElementById('hero');
    if (!hero) { const a = intro.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 250, fill: 'forwards' }); a.finished.then(() => { document.body.classList.remove('intro-on', 'pins-wait'); intro.remove(); }); return [a]; }
    const hr = hero.getBoundingClientRect();
    const W = innerWidth, H = innerHeight, dur = 640, ease = 'cubic-bezier(.65,0,.35,1)';
    const anims = [];
    anims.push(intro.animate([{ clipPath: 'inset(0px 0px 0px 0px round 0px)' }, { clipPath: `inset(${hr.top}px ${W - hr.right}px ${H - hr.bottom}px ${hr.left}px round 30px)` }], { duration: dur, easing: ease, fill: 'forwards' }));
    anims.push(intro.animate([{ backgroundColor: 'rgba(19,34,74,1)' }, { backgroundColor: 'rgba(19,34,74,0)' }], { duration: 320, delay: dur - 60, easing: 'ease-out', fill: 'forwards' }));
    [['iTitle', 'heroTitle'], ['iKick', 'heroKick']].forEach(([a, b]) => {
      const ea = document.getElementById(a), eb = document.getElementById(b);

      ea.style.transformOrigin = '0 0';
      anims.push(ea.animate([{ transform: 'none', color: getComputedStyle(ea).color }, { transform: `translate(${rb.left - ra.left}px,${rb.top - ra.top}px) scale(${s})`, color: to }], { duration: dur, easing: ease, fill: 'forwards' }));
      anims.push(ea.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 160, delay: dur - 20, fill: 'forwards' }));
    });
    intro.querySelectorAll('.mark,.isub,.tapgo,.glow').forEach((el) => anims.push(el.animate([{ opacity: getComputedStyle(el).opacity }, { opacity: 0 }], { duration: 260, easing: 'ease-out', fill: 'forwards' })));
    document.querySelectorAll('.rise,.tabbar').forEach((el, i) => anims.push(el.animate([{ opacity: 0, transform: 'translateY(18px)' }, { opacity: 1, transform: 'none' }], { duration: 480, delay: 300 + Math.min(i, 6) * 55, easing: 'cubic-bezier(.2,.8,.2,1)', fill: 'forwards' })));

    anims.forEach((a) => { const t = a.effect && a.effect.target; if (t && (t.classList.contains('rise') || t.classList.contains('tabbar'))) a.finished.then(() => a.cancel()); });

  }
  window.__morph = morph;
  window.__finishIntro = () => { document.body.classList.remove('intro-on'); intro.remove(); };
  window.__pinsGo = () => document.body.classList.remove('pins-wait');
  let started = false, ready = false, leaving = false, readyT = 0, autoT = 0;
  const go = () => { if (leaving) return; leaving = true; clearTimeout(readyT); clearTimeout(autoT); morph(); };
  function showReady() {
    if (ready) return; ready = true;
    intro.style.setProperty('--hold', HOLD + 'ms');
    intro.classList.toggle('auto', AUTO);
    intro.classList.add('ready');
    if (AUTO && !CAPTURE) autoT = setTimeout(go, HOLD + 150);
  }
  function start() {
    if (started) return; started = true;
    heartGo(false);
    intro.classList.add('play');
    if (!CAPTURE) readyT = setTimeout(showReady, BUILD);
  }
  // wait for the fonts, the map card and the first photos to be loaded and drawn (never more than ~1.8 s, so a slow network can't stall it)
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  const fontsReady = Promise.all(['900 50px Montserrat', '800 40px "Bricolage Grotesque"', '400 16px Inter', '600 16px Inter', '700 16px Inter'].map((f) => document.fonts.load(f))).catch(() => {});
  const heroReady = mapReady.then(() => new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r))));
  const picsReady = () => Promise.all([...document.querySelectorAll('#app img')].slice(0, 4).map((im) => (im.decode ? im.decode().catch(() => {}) : 0)));
  const assets = Promise.all([fontsReady, heroReady]).then(picsReady);
  if (CAPTURE) { show(); start(); }
  else settled.then(() => { show(); return Promise.race([Promise.all([assets, wait(450)]), wait(1600)]); }).then(start);
  // if the screen changes size while the intro is up, hide its words for a moment and bring them back in place, instead of a jump
  let rsT = 0;
  addEventListener('resize', () => {
    if (!shown || leaving || !intro.isConnected) return;
    document.documentElement.classList.add('intro-pending'); intro.classList.remove('shown');
    clearTimeout(rsT); rsT = setTimeout(() => { if (intro.isConnected && !leaving) show(); }, 260);
  });
  // a tap goes in: right away once everything is shown, or after a quick beat if the words are still coming in
  intro.addEventListener('click', () => {
    if (leaving) return;
    if (ready) { go(); return; }
    clearTimeout(readyT); if (!shown) show(); started = true; heartGo(true); intro.classList.add('play', 'fast');
    setTimeout(go, 450);
  });
  window.__introReady = showReady;
  window.__introStart = start;
  window.__placeHeart = () => heartGo(false);
})();
