<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#13224A">
<meta name="robots" content="noindex">
<title>I ♥ Boston · Downtown Crossing</title>
<!-- Mockup (Nov 19, 2026): what a visitor sees after scanning sign DTC-001. Sample listings only. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Inter:wght@400;500;600;700&family=Montserrat:wght@800;900&display=swap">
<style>
:root{
  --navy:#13224A;--navy2:#1B2F63;--red:#E63946;--cream:#FBF5EA;--paper:#fff;--ink:#13224A;--muted:#5C6884;--line:rgba(19,34,74,.12);
  --peach:#FFD9C8;--lilac:#E6D8FF;--butter:#FFE8A3;--mint:#CDEEDC;--sky:#D4E5FF;--pink:#FFD3DA;--ok:#13804A;
  --disp:'Bricolage Grotesque',Inter,system-ui,sans-serif;--logo:Montserrat,Inter,system-ui,sans-serif;--font:Inter,system-ui,-apple-system,'Segoe UI',sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);--pop:cubic-bezier(.34,1.56,.64,1)
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--cream)}
body{font-family:var(--font);color:var(--ink);background:var(--cream);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;max-width:480px;margin:0 auto;min-height:100vh;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
img{display:block}
.ic{flex:none}

/* ---------- header ---------- */
.top{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px}
.logo{display:flex;align-items:center;gap:6px;font-family:var(--logo);font-weight:900;font-size:21px;letter-spacing:.03em;color:var(--navy)}
.logo svg{width:22px;height:22px}
.lang{display:flex;align-items:center;gap:6px;height:38px;padding:0 13px;border-radius:19px;background:var(--paper);border:1.5px solid var(--line);font-weight:700;font-size:14px}

/* ---------- hero: where you are ---------- */
.hero{position:relative;margin:4px 16px 0;padding:20px 20px 18px;border-radius:26px;background:var(--navy);color:#fff;overflow:hidden}
.hero .rings{position:absolute;right:-91px;top:-91px;width:250px;height:250px;pointer-events:none}
.kick{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:rgba(255,255,255,.72);white-space:nowrap}
.kick .ok{width:18px;height:18px;border-radius:50%;background:var(--red);display:grid;place-items:center;color:#fff}
.hero h1{font-family:var(--disp);font-weight:800;font-size:33px;line-height:1.05;letter-spacing:-.02em;margin-top:10px;white-space:nowrap}
.hero .sub{font-size:15px;line-height:1.4;color:rgba(255,255,255,.8);margin-top:8px;max-width:250px}
.search{width:100%;text-align:left;display:flex;align-items:center;gap:10px;height:48px;margin-top:16px;padding:0 16px;border-radius:24px;background:#fff;color:var(--muted);font-size:15.5px;font-weight:500}
.search .ic{color:var(--navy)}

/* ---------- sections ---------- */
.sec{font-family:var(--disp);font-weight:800;font-size:21px;letter-spacing:-.015em;padding:0 18px;margin:26px 0 12px}
.sec-row{display:flex;align-items:baseline;justify-content:space-between;padding-right:18px}
.sec-row .sec{margin-bottom:12px}
.note{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}

/* category stickers */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:0 16px}
.tile{position:relative;height:96px;border-radius:20px;background:var(--bg);border:2px solid var(--navy);box-shadow:0 4px 0 var(--navy);padding:12px;display:flex;flex-direction:column;justify-content:space-between;transition:transform .15s var(--ease),box-shadow .15s var(--ease)}
.tile:active{transform:translateY(3px);box-shadow:0 1px 0 var(--navy)}
.tile b{font-size:16px;font-weight:700}
.tile .live{position:absolute;right:11px;top:13px;display:flex;align-items:center;gap:5px;font-size:11px;font-weight:800;color:#B4232F}
.tile .live i{width:8px;height:8px;border-radius:50%;background:var(--red);box-shadow:0 0 0 3px rgba(230,57,70,.25)}

/* featured (paid) */
.feat{display:flex;gap:12px;overflow-x:auto;padding:0 16px 6px;scrollbar-width:none}
.feat::-webkit-scrollbar{display:none}
.fcard{display:block;flex:none;width:286px;border-radius:22px;background:var(--paper);border:1.5px solid var(--line);overflow:hidden}
.fcard .ph{display:block;position:relative;height:150px;background:#ddd}
.fcard .ph img{width:100%;height:100%;object-fit:cover}
.tag{position:absolute;left:10px;top:10px;padding:4px 9px;border-radius:9px;background:rgba(19,34,74,.82);color:#fff;font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase}
.fcard .ft{display:block;padding:12px 14px 14px}
.fcard b{display:block;font-size:17px;font-weight:700}
.fcard .m{display:block;font-size:14px;color:var(--muted);margin-top:2px}
.deal{display:inline-flex;align-items:center;gap:6px;margin-top:9px;padding:5px 10px;border-radius:10px;background:var(--pink);color:#A61E2B;font-size:13px;font-weight:700}

/* closest list */
.list{margin:0 16px;border-radius:22px;background:var(--paper);border:1.5px solid var(--line);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:10px 12px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row img{width:58px;height:58px;border-radius:14px;object-fit:cover;background:#ddd}
.row .t{flex:1;min-width:0}
.row b{display:block;font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .m{display:block;font-size:13.5px;color:var(--muted);margin-top:2px}
.row .open{color:var(--ok);font-weight:700}
.walk{flex:none;text-align:center;min-width:46px}
.walk b{font-family:var(--disp);font-size:20px;font-weight:800;line-height:1}
.walk span{display:block;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.seeall{display:flex;align-items:center;justify-content:center;gap:6px;margin:12px 16px 0;height:50px;border-radius:25px;border:2px solid var(--navy);font-weight:700;font-size:15px}

/* business call to action */
.biz{margin:26px 16px 0;padding:18px;border-radius:22px;background:var(--butter);border:2px solid var(--navy);box-shadow:0 4px 0 var(--navy)}
.biz b{display:block;font-family:var(--disp);font-size:19px;font-weight:800}
.biz span{display:block;font-size:14.5px;margin-top:4px;color:#3B4663}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 20px;border-radius:23px;background:var(--navy);color:#fff;font-weight:700;font-size:15px;margin-top:12px}
.foot{padding:22px 18px 40px;font-size:12.5px;color:var(--muted);line-height:1.6}
.foot button{text-decoration:underline;font-weight:600;color:var(--navy)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,20px);max-width:calc(100% - 32px);padding:12px 16px;border-radius:16px;background:var(--navy);color:#fff;font-size:14px;font-weight:600;opacity:0;transition:.25s var(--ease);z-index:90;pointer-events:none;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- list page ---------- */
.ptop{display:flex;align-items:center;gap:10px;padding:14px 16px 4px}
.back{width:42px;height:42px;border-radius:50%;background:var(--paper);border:1.5px solid var(--line);display:grid;place-items:center}
.ptitle{padding:6px 18px 0}
.ptitle h1{font-family:var(--disp);font-weight:800;font-size:34px;letter-spacing:-.02em;display:flex;align-items:center;gap:10px}
.ptitle h1 .bub{width:44px;height:44px;border-radius:14px;background:var(--bg);border:2px solid var(--navy);display:grid;place-items:center}
.ptitle p{font-size:15px;color:var(--muted);margin-top:6px}
.chips{display:flex;gap:8px;padding:14px 16px 6px}
.chip{height:36px;padding:0 14px;border-radius:18px;border:1.5px solid var(--line);background:var(--paper);display:flex;align-items:center;gap:6px;font-size:14px;font-weight:600}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.big{margin:10px 16px 0;border-radius:22px;background:var(--paper);border:1.5px solid var(--line);overflow:hidden}
.big .ph{display:block;position:relative;height:168px}
.big .ph img{width:100%;height:100%;object-fit:cover}
.big .bt{display:flex;align-items:center;gap:12px;padding:12px 14px}
.big .bt .t{flex:1;min-width:0}
.big b{display:block;font-size:18px;font-weight:700}
.big .m{display:block;font-size:14px;color:var(--muted);margin-top:2px}

/* ---------- place page ---------- */
.hero-ph{position:relative;height:300px;background:#ccc}
.hero-ph img{width:100%;height:100%;object-fit:cover}
.hero-ph .back{position:absolute;left:16px;top:14px;border:0;box-shadow:0 2px 10px rgba(0,0,0,.2)}
.hero-ph .tag{left:auto;right:16px;top:20px}
.pl-body{position:relative;margin-top:-26px;background:var(--cream);border-radius:26px 26px 0 0;padding:22px 18px 30px}
.pl-body h1{font-family:var(--disp);font-weight:800;font-size:31px;letter-spacing:-.02em;line-height:1.05}
.pl-body .m{font-size:15px;color:var(--muted);margin-top:6px}
.pl-body .m .open{color:var(--ok);font-weight:700}
.dealbig{display:flex;align-items:center;gap:12px;margin-top:16px;padding:14px;border-radius:18px;background:var(--pink);border:2px solid var(--navy);box-shadow:0 4px 0 var(--navy)}
.dealbig .gi{width:42px;height:42px;border-radius:12px;background:#fff;border:2px solid var(--navy);display:grid;place-items:center;color:var(--red);flex:none}
.dealbig b{display:block;font-size:16px}
.dealbig span{display:block;font-size:13.5px;color:#4A3440;margin-top:1px}
.acts{display:grid;grid-template-columns:1.25fr .8fr 1.15fr;gap:10px;margin-top:16px}
.act{height:54px;border-radius:16px;background:var(--paper);border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;gap:7px;font-weight:700;font-size:15px}
.act.pri{background:var(--navy);border-color:var(--navy);color:#fff}
.about{font-size:16px;line-height:1.5;margin-top:18px;color:#26324F}
.strip{display:flex;gap:8px;margin:16px -18px 0;padding:0 18px;overflow-x:auto;scrollbar-width:none}
.strip img{flex:none;width:150px;height:112px;border-radius:16px;object-fit:cover}
.facts{margin-top:16px;border-radius:18px;background:var(--paper);border:1.5px solid var(--line)}
.fact{display:flex;gap:12px;align-items:center;padding:13px 14px;border-top:1px solid var(--line);font-size:15px}
.fact:first-child{border-top:0}
.fact .ic{color:var(--muted)}
.fact span{flex:1}
.fact small{color:var(--muted);font-size:13.5px}

/* home content waits under the intro, then rises in */
body.intro-on .rise{opacity:0;transform:translateY(18px)}

/* ---------- the intro: the sign you scanned comes alive ---------- */
#intro{position:fixed;inset:0;z-index:100;background:var(--navy);color:#fff;overflow:hidden}
#intro .stage{position:absolute;left:0;right:0;top:50%;transform:translateY(-62%);display:flex;flex-direction:column;align-items:center;text-align:center}
#intro .glow{position:absolute;left:50%;top:50%;width:560px;height:560px;margin:-280px 0 0 -280px;border-radius:50%;background:radial-gradient(circle,rgba(230,57,70,.22),rgba(230,57,70,0) 62%);opacity:0;animation:fadeIn .8s .9s var(--ease) forwards}
.qrwrap{position:relative;width:176px;height:176px;padding:14px;border-radius:30px;background:#fff;animation:qrIn .35s var(--ease) both,qrOut .3s .9s cubic-bezier(.5,0,.75,0) forwards}
.qrsvg{width:100%;height:100%}
.qrsvg .qm,.qrsvg .qc{fill:var(--navy)}
.qrsvg .qf{stroke:var(--navy)}
.scanline{position:absolute;left:8px;right:8px;top:12px;height:4px;border-radius:2px;background:var(--red);box-shadow:0 0 14px 3px rgba(230,57,70,.65);animation:scan .62s .2s ease-in-out both}
.qrcheck{position:absolute;inset:0;border-radius:30px;display:grid;place-items:center;background:rgba(255,255,255,.0);animation:flash .3s .78s ease-out both}
.mark{position:relative;display:flex;align-items:center;gap:12px;font-family:var(--logo);font-weight:900;font-size:50px;letter-spacing:.03em;line-height:1;margin-top:-176px;height:176px}
.mark .hI,.mark .hB{opacity:0;position:relative;z-index:1}
.mark .hI{animation:fromHeartL .45s 1.34s var(--ease) forwards}
.mark .hB{animation:fromHeartR .5s 1.38s var(--ease) forwards}
.mark .heart{position:relative;z-index:2;width:54px;height:54px;transform:translateX(var(--hx,0)) scale(0);animation:heartPop .55s .95s var(--pop) forwards,heartSlide .48s 1.25s var(--ease) forwards,beat .5s 2.15s ease-in-out}
.mark .heart svg{width:100%;height:100%;overflow:visible}
.ping{position:absolute;left:50%;top:50%;width:60px;height:60px;margin:-30px 0 0 -30px;border-radius:50%;border:3px solid var(--red);opacity:0;transform:scale(.6);animation:ping 1s 1s ease-out}
.ikick{margin-top:22px;opacity:0;animation:up .45s 1.62s var(--ease) forwards}
.ititle{font-family:var(--disp);font-weight:800;font-size:40px;letter-spacing:-.02em;line-height:1.05;margin-top:10px;white-space:nowrap;opacity:0;animation:up .5s 1.76s var(--ease) forwards}
.isub{font-size:16px;color:rgba(255,255,255,.75);margin-top:12px;opacity:0;animation:up .45s 1.95s var(--ease) forwards}
.skip{position:absolute;right:16px;bottom:calc(22px + env(safe-area-inset-bottom));height:36px;padding:0 14px;border-radius:18px;background:rgba(255,255,255,.12);color:rgba(255,255,255,.85);font-size:13.5px;font-weight:700;opacity:0;animation:fadeIn .4s .6s forwards}
#intro.fast *{animation-duration:.01s!important;animation-delay:0s!important}
#intro.fast .qrwrap,#intro.fast .scanline,#intro.fast .ping{display:none}

@keyframes qrIn{from{opacity:0;transform:scale(.85)}}
@keyframes qrOut{to{opacity:0;transform:scale(.15) rotate(-8deg)}}
@keyframes scan{0%{top:12px;opacity:0}12%{opacity:1}88%{opacity:1}100%{top:calc(100% - 16px);opacity:0}}
@keyframes flash{0%{background:rgba(255,255,255,0)}40%{background:rgba(255,255,255,.85)}100%{background:rgba(255,255,255,0)}}
@keyframes heartPop{0%{transform:translateX(var(--hx,0)) scale(0)}60%{transform:translateX(var(--hx,0)) scale(1.3)}100%{transform:translateX(var(--hx,0)) scale(1)}}
@keyframes heartSlide{from{transform:translateX(var(--hx,0)) scale(1)}to{transform:translateX(0) scale(1)}}
@keyframes beat{0%,100%{transform:scale(1)}30%{transform:scale(1.18)}60%{transform:scale(.96)}}
@keyframes ping{0%{opacity:.7;transform:scale(.6)}100%{opacity:0;transform:scale(4.2)}}
@keyframes fromHeartL{from{opacity:0;transform:translateX(10px)}to{opacity:1;transform:none}}
@keyframes fromHeartR{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes fadeIn{to{opacity:1}}
@media (prefers-reduced-motion:reduce){#intro{display:none}body.intro-on .rise{opacity:1;transform:none}}
</style>
</head>

      const ea = document.getElementById(a), eb = document.getElementById(b);
      const ra = ea.getBoundingClientRect(), rb = eb.getBoundingClientRect();
      const s = rb.width / ra.width;
      ea.style.transformOrigin = '0 0';
      anims.push(ea.animate([{ transform: 'none', opacity: 1 }, { transform: `translate(${rb.left - ra.left}px,${rb.top - ra.top}px) scale(${s})`, opacity: 1 }], { duration: dur, easing: ease, fill: 'forwards' }));
    });
    intro.querySelectorAll('.mark,.isub,.skip,.glow').forEach((el) => anims.push(el.animate([{ opacity: getComputedStyle(el).opacity }, { opacity: 0 }], { duration: 260, easing: 'ease-out', fill: 'forwards' })));
    // the rest of the page rises in behind it
    document.querySelectorAll('.rise').forEach((el, i) => anims.push(el.animate([{ opacity: 0, transform: 'translateY(18px)' }, { opacity: 1, transform: 'none' }], { duration: 480, delay: 260 + Math.min(i, 6) * 55, easing: 'cubic-bezier(.2,.8,.2,1)', fill: 'forwards' })));
    hero.querySelectorAll('.sub,.search,.rings').forEach((el, i) => anims.push(el.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 360, delay: dur - 120 + i * 60, fill: 'backwards' })));
    const finish = () => { document.body.classList.remove('intro-on'); intro.remove(); };
    anims.forEach((a) => { const t = a.effect && a.effect.target; if (t && t.classList.contains('rise')) a.finished.then(() => a.cancel()); });
    anims[0].finished.then(finish);
    if (paused) anims.forEach((a) => a.pause());
    window.__morphAnims = anims;
    return anims;
  }
  window.__morph = morph;
  intro.addEventListener('click', () => { intro.classList.add('fast'); setTimeout(() => morph(), 40); });
  window.__finishIntro = () => { document.body.classList.remove('intro-on'); intro.remove(); };
  if (!CAPTURE) setTimeout(() => morph(), 2500);
})();
</script>
